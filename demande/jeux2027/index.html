<!doctype html>
<html lang="fr">
<head>

<title>Base logistique Motu Uta — Tahiti Maison Container</title>
<style>
:root{--navy:#1f3864;--navy2:#2c4d86;--or:#e36c0a;--vert:#1e7b34;--rouge:#c0392b;--gris:#5b6470;--bg:#eef1f6;--card:#fff;--bord:#d9e0ea;--ombre:0 2px 10px rgba(31,56,100,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#18202e;line-height:1.5;font-size:16px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header .logo{width:34px;height:34px;border-radius:8px;background:var(--or);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
header h1{margin:0;font-size:15px;font-weight:700;line-height:1.2}
header p{margin:1px 0 0;font-size:11.5px;opacity:.75}
.bar{height:4px;background:#dde3ec}
.bar i{display:block;height:100%;background:var(--or);width:0;transition:width .3s ease}
main{flex:1;padding:22px 18px 130px}
.step{display:none;animation:in .25s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--or);margin-bottom:6px}
.kicker b{color:var(--navy)}
.kicker i{font-style:normal;color:#b3bdcb;margin:0 5px}
h2{margin:0 0 6px;font-size:22px;line-height:1.25;color:var(--navy);font-weight:750}
.sub{margin:0 0 18px;font-size:14px;color:var(--gris)}
.opts{display:flex;flex-direction:column;gap:9px}
button.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bord);border-radius:12px;padding:15px 16px;font:inherit;font-size:15.5px;color:#18202e;cursor:pointer;box-shadow:var(--ombre);transition:.12s}
button.opt:hover{border-color:var(--navy2)}
button.opt.sel{border-color:var(--navy);background:#eff3fb;box-shadow:inset 0 0 0 1px var(--navy)}
button.opt .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--bord);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
button.opt.sel .ic{background:var(--navy);border-color:var(--navy)}
button.opt .tx{flex:1}
button.opt .tx small{display:block;color:var(--gris);font-size:12.5px;margin-top:2px;line-height:1.35}
label.f{display:block;margin-bottom:13px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:2px 0 13px}
.sep2{height:1px;background:var(--bord);margin:20px 0 16px}
.mods label.f{margin-bottom:0}
.mods input{text-align:center;font-weight:700}
label.f span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#2b3646}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--bord);border-radius:11px;background:var(--card);color:#18202e}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--navy)}
textarea{min-height:88px;resize:vertical}
.err{color:var(--rouge);font-size:13px;margin-top:8px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(238,241,246,.97);backdrop-filter:blur(8px);border-top:1px solid var(--bord);padding:11px 18px calc(11px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-size:15.5px;font-weight:700;border:0;border-radius:11px;padding:14px 20px;cursor:pointer}
.btn.p{background:var(--navy);color:#fff;flex:1}
.btn.p:disabled{background:#a9b3c4;cursor:not-allowed}
.btn.s{background:transparent;color:var(--gris);padding:14px 12px;font-weight:600}
.prix{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:16px 18px;margin:16px 0 4px;box-shadow:var(--ombre)}
.prix .lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;opacity:.8}
.prix .val{font-size:29px;font-weight:800;line-height:1.15;margin:3px 0}
.prix .det{font-size:12.5px;opacity:.85}
.note{background:#fdf3e7;border-left:3px solid var(--or);padding:11px 13px;font-size:13.5px;border-radius:0 9px 9px 0;margin:14px 0}
.note b{color:#a04c05}
.grille{margin:9px 0 12px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:12.8px;align-items:baseline}
.grille i{font-style:normal;color:#6b5744;line-height:1.3}
.grille b{color:#a04c05;white-space:nowrap;text-align:right;font-weight:700}
.grille em{grid-column:1/-1;font-style:normal;font-weight:800;color:var(--navy);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;margin:9px 0 1px;padding-bottom:4px;border-bottom:1px solid #ecd9bf}
.grille em:first-child{margin-top:2px}
.pj{margin:16px 0 2px}
.pjb{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--card);border:1.5px dashed #b9c3d2;border-radius:12px;padding:15px 16px;font-size:14.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:.12s}
.pjb:hover{border-color:var(--navy);background:#f6f9ff}
.pjb input{display:none}
.pja{margin:8px 2px 0;font-size:12.5px;color:var(--gris);line-height:1.45}
.pjf{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--bord);border-radius:11px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.pjf .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#18202e}
.pjf .sz{color:var(--gris);font-size:12px;white-space:nowrap}
.pjf .rm{border:0;background:transparent;font:inherit;font-size:18px;line-height:1;color:#98a2b3;cursor:pointer;padding:0 2px}
.pjf .rm:hover{color:var(--rouge)}
.pjerr{color:var(--rouge);font-size:12.8px;font-weight:600;margin-top:8px}
.gab{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px 10px 10px;margin:14px 0 4px;box-shadow:var(--ombre)}
.gab svg{display:block;width:100%;height:auto}
.gab .lg{font-size:12.3px;color:var(--gris);line-height:1.65;margin:9px 4px 0}
.gab .lg b{color:#18202e}
.gab .lg u{text-decoration:none;color:#a04c05;font-weight:700}
.gab .sep{height:1px;background:var(--bord);margin:12px 2px 10px}
.recap{background:var(--card);border:1px solid var(--bord);border-radius:13px;padding:4px 16px;box-shadow:var(--ombre)}
.recap .r{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #f0f3f7;font-size:14px}
.recap .r:last-child{border:0}
.recap .r b{color:var(--gris);font-weight:600;flex:0 0 42%}
.recap .r span{text-align:right;flex:1}
.fin{text-align:center;padding:16px 0}
.fin .ok{width:66px;height:66px;border-radius:50%;background:var(--vert);color:#fff;font-size:33px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
footer{padding:16px 18px 26px;text-align:center;color:var(--gris);font-size:12px;line-height:1.6}
footer a{color:var(--navy);text-decoration:none;font-weight:600}

.mods{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:2px 0 13px}
.mods label.f{margin-bottom:0}
.mods input{text-align:center;font-weight:700}
.sep2{height:1px;background:var(--bord);margin:20px 0 16px}
.estim{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:17px 18px;margin:16px 0 6px;box-shadow:var(--ombre)}
.estim .lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;opacity:.82}
.estim .val{font-size:25px;font-weight:800;line-height:1.2;margin:4px 0 2px}
.estim .det{font-size:12.5px;opacity:.88;line-height:1.5}
.estim .urg{display:inline-block;background:var(--or);color:#fff;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;margin-top:9px}
.decomp{margin:11px 0 2px;display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:12.4px;align-items:baseline;border-top:1px solid rgba(255,255,255,.22);padding-top:10px}
.decomp i{font-style:normal;opacity:.86}
.decomp b{text-align:right;white-space:nowrap;font-weight:700}
.decomp em{grid-column:1/-1;font-style:normal;font-size:11px;opacity:.72;margin-top:7px;line-height:1.45}
.cmp{margin:9px 0 4px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:12.8px;align-items:baseline}
.cmp i{font-style:normal;color:#6b5744;line-height:1.3}
.cmp b{color:#a04c05;white-space:nowrap;text-align:right;font-weight:700}
.cmp em{grid-column:1/-1;font-style:normal;font-weight:800;color:var(--navy);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;margin:9px 0 1px;padding-bottom:4px;border-bottom:1px solid #ecd9bf}
.cmp em:first-child{margin-top:2px}
</style>

<div class="app">
<header>
  <div class="logo">TMC</div>
  <div><h1>Tahiti Maison Container</h1><p>Base logistique Motu Uta — Jeux du Pacifique 2027</p></div>

<div class="bar"><i id="bar"></i></div>
<main id="main"></main>

  <button class="btn s" id="back" onclick="prec()">Retour</button>

<script>
/* =========================================================================
   Base logistique Motu Uta — Jeux du Pacifique 2027
   Questionnaire dedie au Comite Organisateur. Une seule page, pas de cadre.
   ========================================================================= */

var RELAIS    = "https://formsubmit.co/ajax/f86aed3fe4300aa72852f47498da914a";
var RELAIS_PJ = "https://formsubmit.co/f86aed3fe4300aa72852f47498da914a";

/* ---- Reperes de prix -----------------------------------------------------
   Conteneurs : tarifs publics TMC livres Papeete. Motu Uta est en zone
   portuaire de Papeete, pas de supplement de commune.
   Taux d amenagement : plancher constate sur les devis TMC 2020-2026.
   Equipements : ordres de grandeur, a ajuster ici et nulle part ailleurs.
   Coefficient marche public : delai de reglement, retenue de garantie,
   exigences ERP et PMR, chantier etale par les validations.
   -------------------------------------------------------------------------*/
var BASE20 = 623451, BASE40 = 832451;
var S20 = 13, S40 = 28;                 /* surface au sol hors tout, m2 */
var TAUX_BUREAU = 180000;               /* XPF par m2 */
var TAUX_STOCK  = 120000;
var COEF_PUBLIC = 2;                    /* conditions marche public */
var HAUT = 1.30;                        /* borne haute de la fourchette */
var M2_PAR_POSTE = 9;                   /* base logistique, poste de travail */

var EQUIP = [
  ["Climatisation",                      "Un split par module, pose et raccordement",         320000, "module"],
  ["Réseau informatique et courants faibles", "Chemins de câbles, prises RJ45, baie de brassage", 180000, "module"],
  ["Isolation renforcée et bardage",      "Confort thermique et acoustique en zone portuaire", 210000, "module"],
  ["Bloc sanitaire équipé",               "WC, lave-mains, raccordements",                   1450000, "forfait"],
  ["Coin repas ou kitchenette",           "Plan de travail, évier, rangements",               680000, "forfait"],
  ["Accessibilité PMR",                   "Rampe, sanitaire adapté, seuils et largeurs",      780000, "forfait"],
  ["Contrôle d'accès et alarme",          "Badge ou digicode, détection intrusion",           540000, "forfait"],
  ["Auvent ou coursive couverte",         "Circulation abritée entre les modules",            490000, "forfait"],
  ["Groupe électrogène de secours",       "Continuité d'exploitation en cas de coupure",     1250000, "forfait"]
];

/* Majoration liee au delai : mobilisation d une equipe dediee, heures
   supplementaires, approvisionnement accelere sur les lots longs. */
var DELAIS = [
  ["Après juin 2027",        "Après les Jeux, ou sans contrainte de date",              0.00],
  ["Avant juin 2027",        "Livré pour la période des Jeux, planning confortable",    0.08],
  ["Avant mars 2027",        "Mise en service avant la montée en charge",               0.18],
  ["Avant décembre 2026",    "Délai très court : équipe dédiée et heures supplémentaires", 0.35]
];

var S = {}, MULTI = {}, idx = 0, ordre = [];

function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function mio(n){
  var v = n / 1000000;
  return (v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(".", ",") + " M";
}

/* ============ MODULES ET SURFACE ============ */
function nMod(k){ var v = parseInt(S[k], 10); return (isNaN(v) || v < 0) ? 0 : Math.min(60, v); }
function totalMod(){ return nMod("n20") + nMod("n40"); }
function surfaceMod(){ return nMod("n20") * S20 + nMod("n40") * S40; }
function libelleMod(){
  var a = nMod("n20"), b = nMod("n40"), p = [];
  if(a) p.push(a + " × 20 pieds");
  if(b) p.push(b + " × 40 pieds");
  return p.join(" + ");
}
function surface(){
  var m = parseFloat(String(S.surface || "").replace(",", "."));
  return (!m || m <= 0) ? 0 : m;
}
function postes(){ var v = parseInt(S.effectif, 10); return (isNaN(v) || v < 0) ? 0 : v; }

/* ============ CHIFFRAGE ============ */
function tauxAmenagement(){
  var f = String(S.fonction || "");
  /* uniquement du stockage : pas de cloisonnement ni de climatisation de bureau */
  if(f && f.indexOf("Stockage") > -1 && f.indexOf("Bureaux") === -1
       && f.indexOf("PC opérationnel") === -1 && f.indexOf("Accueil") === -1
       && f.indexOf("Salle de réunion") === -1) return TAUX_STOCK;
  return TAUX_BUREAU;
}
function coutConteneurs(){ return nMod("n20") * BASE20 + nMod("n40") * BASE40; }
function coutAmenagement(){ return surface() * tauxAmenagement(); }
function coutEquipements(){
  var a = MULTI.equipements || [], t = 0, n = Math.max(1, totalMod());
  for(var i = 0; i < EQUIP.length; i++)
    if(a.indexOf(EQUIP[i][0]) > -1) t += EQUIP[i][2] * (EQUIP[i][3] === "module" ? n : 1);
  return t;
}
function majDelai(){
  for(var i = 0; i < DELAIS.length; i++) if(S.delai === DELAIS[i][0]) return DELAIS[i][2];
  return null;
}
function chiffrage(){
  var c = coutConteneurs(), a = coutAmenagement(), e = coutEquipements();
  if(!surface() || !totalMod()) return null;
  var st = c + a + e;
  var pub = st * COEF_PUBLIC;
  var m = majDelai();
  var bas = pub * (1 + (m === null ? 0 : m));
  return { cont:c, amen:a, equip:e, sousTotal:st, public:pub, maj:m, bas:bas, haut:bas * HAUT };
}

function blocEstimation(complet){
  var r = chiffrage();
  if(!r) return "";
  var h = '<div class="estim"><div class="lb">Ordre de grandeur pour ce projet</div>'
        + '<div class="val">' + mio(r.bas) + ' à ' + mio(r.haut) + ' XPF</div>'
        + '<div class="det">Estimation indicative établie à partir de nos chantiers réalisés en Polynésie. '
        + 'Ce n\'est pas un devis : le chiffrage définitif se fait sur votre plan d\'aménagement.</div>';
  if(r.maj) h += '<div class="urg">dont + ' + Math.round(r.maj * 100) + ' % liés au délai demandé</div>';
  if(complet){
    h += '<div class="decomp">'
       + '<i>' + esc(libelleMod()) + ', achat et livraison à Motu Uta</i><b>' + fmt(r.cont) + '</b>'
       + '<i>Aménagement de ' + surface() + ' m²</i><b>' + fmt(r.amen) + '</b>';
    if(r.equip) h += '<i>Équipements retenus</i><b>' + fmt(r.equip) + '</b>';
    h += '<i>Conditions marché public</i><b>' + fmt(r.public - r.sousTotal) + '</b>';
    if(r.maj) h += '<i>Délai — ' + esc(S.delai) + '</i><b>+ ' + fmt(r.bas - r.public) + '</b>';
    h += '<em>Conditions marché public : règlement après service fait, retenue de garantie, '
       + 'exigences ERP et accessibilité, chantier étalé par les validations administratives. '
       + 'Montants en XPF, hors étude détaillée et hors plans.</em></div>';
  }
  return h + '</div>';
}

/* ============ GABARIT A L ECHELLE ============ */
/* Dessin de cote, 25 pixels par metre. Le personnage mesure 1,80 m
   et se tient a l interieur : le client voit la hauteur sous plafond. */
function bonhomme(x, sol, t){
  t = t || 45; /* 45 px = 1,80 m a l echelle de 25 px par metre */
  var e = t / 45;
  return '<g fill="#e07b15" transform="translate(' + x + ',' + (sol - t) + ') scale(' + e + ')">'
       + '<circle cx="7" cy="4.5" r="4.5"/>'
       + '<path d="M7 10.5 c-5.5 0 -6.5 3.5 -6.5 7.5 v9.5 h2.6 v17.5 h2.6 v-16 h2.6 v16 h2.6 v-17.5 h2.6 v-9.5 c0 -4 -1 -7.5 -6.5 -7.5 z"/>'
       + '</g>';
}
function cote(x1, y1, x2, y2, txt, tx, ty, anc){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#98a2b3" stroke-width="1"/>'
       + '<text x="' + tx + '" y="' + ty + '" font-size="9" fill="#5b6470" text-anchor="' + anc + '">' + txt + '</text>';
}
function boite(x, y, w, h, titre, ty){
  var g = '<text x="' + x + '" y="' + ty + '" font-size="10.5" font-weight="700" fill="#1e3a5f">' + titre + '</text>';
  g += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2" fill="#eef2f8" stroke="#1e3a5f" stroke-width="1.6"/>';
  var nb = Math.round(w / 15); /* une nervure tous les 60 cm environ */
  for(var i = 1; i < nb; i++){
    var cx = x + w * i / nb;
    g += '<line x1="' + cx + '" y1="' + (y + 4) + '" x2="' + cx + '" y2="' + (y + h - 4) + '" stroke="#c9d4e4" stroke-width="1"/>';
  }
  g += '<line x1="' + (x - 6) + '" y1="' + (y + h) + '" x2="' + (x + w + 6) + '" y2="' + (y + h) + '" stroke="#1e3a5f" stroke-width="1.4"/>';
  return g;
}
/* Vue de dessus : un simple rectangle a l echelle, longueur par largeur,
   avec la surface au sol et le volume. Meme echelle que la vue de cote. */
function dessus(x, y, L, W, k, titre, ty, surf){
  var w = L * k, h = W * k;
  var g = '<text x="' + x + '" y="' + ty + '" font-size="10.5" font-weight="700" fill="#1e3a5f">' + titre + '</text>';
  g += '<rect x="' + x + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="#eef2f8" stroke="#1e3a5f" stroke-width="1.6"/>';
  /* portes sur le bout droit */
  g += '<line x1="' + (x + w - 7).toFixed(1) + '" y1="' + y + '" x2="' + (x + w - 7).toFixed(1) + '" y2="' + (y + h).toFixed(1) + '" stroke="#1e3a5f" stroke-width="1"/>';
  /* une personne vue de dessus : 55 cm de large */
  var r = 0.275 * k;
  g += '<circle cx="' + (x + 22).toFixed(1) + '" cy="' + (y + h / 2).toFixed(1) + '" r="' + r.toFixed(1) + '" fill="#e07b15"/>';
  g += '<text x="' + (x + w / 2 + 14).toFixed(1) + '" y="' + (y + h / 2 + 5).toFixed(1) + '" font-size="13" font-weight="800" fill="#a04c05" text-anchor="middle">' + surf + '</text>';
  g += cote(x, y + h + 12, x + w, y + h + 12, L.toFixed(2).replace(".", ",") + " m", x + w / 2, y + h + 25, "middle");
  g += cote(x + w + 8, y, x + w + 8, y + h, "2,44 m", x + w + 12, y + h / 2 + 3, "start");
  return g;
}
var PLONGEE = (function(){
  var k = 25;
  var v = '<svg viewBox="0 0 360 234" role="img" aria-label="Vue de dessus a l echelle d un conteneur 20 pieds et d un 40 pieds">';
  v += dessus(14, 22, 6.06, 2.44, k, "20 pieds DRY — vu de dessus", 15, "13 m²");
  v += dessus(14, 135, 12.19, 2.44, k, "40 pieds HC — vu de dessus", 128, "28 m²");
  return v + '</svg>';
})();

var GABARIT = (function(){
  var v = '<svg viewBox="0 0 360 248" role="img" aria-label="Comparaison a l echelle d un conteneur 20 pieds et d un 40 pieds avec une personne de 1,80 m">';
  /* 20 pieds : 6,06 x 2,59 m */
  v += boite(14, 22, 151.5, 64.75, "20 pieds DRY", 15);
  v += bonhomme(30, 86.75);
  v += cote(172, 22, 172, 86.75, "2,59 m", 176, 57, "start");
  v += cote(14, 100, 165.5, 100, "6,06 m", 90, 113, "middle");

var PJ = [], PJMAX = 6, PJUN = 4 * 1024 * 1024, PJTOT = 9 * 1024 * 1024;

function poids(o){ return o < 1048576 ? Math.max(1, Math.round(o/1024)) + " Ko" : (o/1048576).toFixed(1).replace(".",",") + " Mo"; }
function totalPJ(){ var t=0; for(var i=0;i<PJ.length;i++) t += PJ[i].blob.size; return t; }

function listePJ(){
  var h = "";
  for(var i=0;i<PJ.length;i++)
    h += '<div class="pjf"><span class="nm">' + esc(PJ[i].nom) + '</span>'
       + '<span class="sz">' + poids(PJ[i].blob.size) + '</span>'
       + '<button class="rm" type="button" title="Retirer" onclick="retirePJ(' + i + ')">×</button></div>';
  if(PJ.length) h += '<p class="pja">' + PJ.length + (PJ.length>1?" fichiers joints, ":" fichier joint, ")
       + poids(totalPJ()) + ' au total.</p>';
  if(window.PJMSG) h += '<div class="pjerr">' + esc(PJMSG) + '</div>';
  return h;
}
function rafraichirPJ(){ var z=document.getElementById("pjliste"); if(z) z.innerHTML = listePJ(); }
function retirePJ(i){ PJ.splice(i,1); PJMSG=""; rafraichirPJ(); }

function compresse(f){
  return new Promise(function(res){
    if(String(f.type).indexOf("image/") !== 0 || f.type === "image/gif"){ res({nom:f.name, blob:f}); return; }
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function(){
      try{
        var M = 1600, r = Math.min(1, M / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(b){
          URL.revokeObjectURL(url);
          if(b && b.size < f.size) res({nom:String(f.name).replace(/\.[^.]+$/,"") + ".jpg", blob:b});
          else res({nom:f.name, blob:f});
        }, "image/jpeg", 0.72);
      }catch(err){ URL.revokeObjectURL(url); res({nom:f.name, blob:f}); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res({nom:f.name, blob:f}); };
    img.src = url;
  });
}

function ajoutPJ(input){
  var fs = Array.prototype.slice.call(input.files || []);
  input.value = "";
  if(!fs.length) return;
  PJMSG = "";
  var z = document.getElementById("pjliste");
  if(z) z.innerHTML = '<p class="pja">Préparation des fichiers…</p>';
  Promise.all(fs.map(compresse)).then(function(prets){
    for(var i=0;i<prets.length;i++){
      var f = prets[i];
      if(PJ.length >= PJMAX){ PJMSG = "6 fichiers au maximum. Les suivants n'ont pas été ajoutés."; break; }
      if(f.blob.size > PJUN){ PJMSG = f.nom + " dépasse 4 Mo et n'a pas pu être joint. Envoyez-le-moi par mail après votre demande."; continue; }
      if(totalPJ() + f.blob.size > PJTOT){ PJMSG = "Limite de 9 Mo atteinte. " + f.nom + " n'a pas été ajouté."; continue; }
      PJ.push(f);
    }
    rafraichirPJ();
  }).catch(function(){ PJMSG = "Un fichier n'a pas pu être lu."; rafraichirPJ(); });
}

function envoiPJ(sujet){
  if(!PJ.length) return;
  try{
    var fd = new FormData();
    fd.append("_subject", "Pièces jointes — " + sujet);
    fd.append("_template", "box");
    fd.append("_captcha", "false");
    fd.append("Rappel", "Ces fichiers accompagnent la demande de " + (S.nom||"sans nom")
      + (S.tel ? " — " + S.tel : "") + (S.mail ? " — " + S.mail : "") + ".");
    fd.append("Nombre", PJ.length + (PJ.length>1 ? " fichiers" : " fichier"));
    /* un nom de champ distinct par fichier : le relais n en garde qu un seul si les noms sont identiques */
    for(var i=0;i<PJ.length;i++) fd.append(i ? "attachment" + (i+1) : "attachment", PJ[i].blob, PJ[i].nom);
    fetch(RELAIS_PJ, {method:"POST", mode:"no-cors", body:fd});
  }catch(e){}
}


/* ============ INTERACTIONS ============ */
function effaceErr(){ var d = document.getElementById("err"); if(d) d.innerHTML = ""; }

function choix(champ, i){
  var e = E[ordre[idx]];
  S[champ] = e.o[i][0];
  rendre();
  if(!e.pj && !e.cmp) setTimeout(suiv, 180);
}

function coche(champ, i){
  var e = E[ordre[idx]];
  var liste = e.tarifs ? EQUIP : e.o;
  var v = liste[i][0], excl = e.tarifs ? false : !!liste[i][2];
  var a = MULTI[champ] || (MULTI[champ] = []);
  var k = a.indexOf(v);
  if(k > -1) a.splice(k, 1);
  else if(excl){ a.length = 0; a.push(v); }
  else {
    for(var j = a.length - 1; j >= 0; j--)
      for(var q = 0; q < liste.length; q++)
        if(liste[q][0] === a[j] && !e.tarifs && liste[q][2]) a.splice(j, 1);
    a.push(v);
  }
  var rang = {};
  for(var z = 0; z < liste.length; z++) rang[liste[z][0]] = z;
  a.sort(function(x, y){ return rang[x] - rang[y]; });
  S[champ] = a.join(" · ");
  if(!a.length) delete S[champ];
  effaceErr();
  rendre();
}

function choixDelai(i){ S.delai = DELAIS[i][0]; effaceErr(); rendre(); }

function maj(champ, val){ S[champ] = val; effaceErr(); rafraichir(); }

function majMod(k, v){
  S[k] = v;
  effaceErr();
  if(!S.surfaceManuelle){ var q = surfaceMod(); if(q) S.surface = String(q); else delete S.surface; }
  var z = document.getElementById("modres"); if(z) z.innerHTML = blocModules();
  var y = document.getElementById("surfzone"); if(y) y.innerHTML = blocSurface();
  rafraichir();
}

/* met a jour l estimation sans reconstruire l ecran : le curseur reste dans le champ */
function rafraichir(){
  if(document.activeElement && document.activeElement.id === "i_surface") S.surfaceManuelle = 1;
  var m = document.getElementById("main");
  var vieux = m.querySelector(".estim");
  var neuf = blocEstimation(!!E[ordre[idx]].recap);
  if(vieux && neuf){ var d = document.createElement("div"); d.innerHTML = neuf; vieux.replaceWith(d.firstChild); }
  else if(vieux && !neuf) vieux.remove();
  else if(neuf && !E[ordre[idx]].intro){
    var d2 = document.createElement("div"); d2.innerHTML = neuf;
    m.querySelector(".step").insertBefore(d2.firstChild, document.getElementById("err"));
  }
}

function valide(){
  var e = E[ordre[idx]];
  if(e.o && !e.multi && !S[e.ch]) return "Choisissez une réponse pour continuer.";
  if(e.cmp && !S.delai) return "Choisissez une échéance pour continuer.";
  if((e.o || e.tarifs) && e.multi && !S[e.ch] && !e.tarifs) return "Choisissez au moins une réponse.";
  if(e.txts && (!S.direction || S.direction.trim().length < 2)) return "Indiquez la direction ou le service.";
  if(e.num && !postes()) return "Indiquez le nombre de personnes accueillies.";
  if(e.mod && !totalMod()) return "Indiquez le nombre de modules.";
  if(e.num2 && !surface()) return "Indiquez la surface totale.";
  if(e.contact){
    if(!S.nom || S.nom.trim().length < 2) return "Merci d'indiquer votre nom.";
    if(String(S.tel || "").replace(/[^0-9+]/g, "").length < 6) return "Merci d'indiquer un numéro de téléphone valide.";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(S.mail || ""))) return "Merci d'indiquer un email valide.";
  }
  return null;
}

function suiv(){
  var m = valide();
  if(m){ var d = document.getElementById("err"); if(d) d.innerHTML = '<div class="err">' + m + '</div>'; return; }
  if(E[ordre[idx]].recap){ envoyer(); return; }
  if(idx < ordre.length - 1){ idx++; rendre(); }
}
function prec(){ if(idx > 0){ idx--; rendre(); } }

/* ============ TOPO POUR TMC ============ */
function tir(n){ var s = ""; for(var i = 0; i < n; i++) s += "-"; return s; }
function lg(e, v){ if(!v) return ""; if(!e) return "  " + v; while(e.length < 20) e += " "; return "  " + e + " : " + v; }

function topo(){
  var r = chiffrage(), L = [];
  function bloc(t, ls){
    ls = ls.filter(function(x){ return x; });
    if(!ls.length) return;
    L.push(""); L.push(t); L.push(tir(t.length));
    for(var i = 0; i < ls.length; i++) L.push(ls[i]);
  }
  L.push("JEUX DU PACIFIQUE 2027 — BASE LOGISTIQUE MOTU UTA");
  L.push(tir(50));

  bloc("LE DEMANDEUR", [lg("", S.nom || "sans nom"), lg("Direction", S.direction),
    lg("Référent", S.referent), lg("Téléphone", S.tel), lg("Email", S.mail)]);

  bloc("LE BESOIN", [lg("Fonction", S.fonction), lg("Effectif", postes() ? postes() + " personnes" : ""),
    lg("Modules", libelleMod()), lg("Surface", surface() ? surface() + " m² au sol" : ""),
    lg("Implantation", S.implantation), lg("Durée d'usage", S.duree),
    lg("Équipements", S.equipements)]);

  bloc("LE SITE", [lg("Motu Uta", S.site),
    lg("Plan joint", PJ.length ? PJ.length + (PJ.length > 1 ? " fichiers envoyés dans un second mail" : " fichier envoyé dans un second mail") : "aucun")]);

  if(r){
    var a = [
      lg("Conteneurs", fmt(r.cont) + " XPF  (" + libelleMod() + ", livrés Papeete)"),
      lg("Aménagement", fmt(r.amen) + " XPF  (" + surface() + " m² × " + fmt(tauxAmenagement()) + " XPF/m²)")
    ];
    if(r.equip) a.push(lg("Équipements", fmt(r.equip) + " XPF"));
    a.push(lg("Sous-total", fmt(r.sousTotal) + " XPF  (coût de revient plancher)"));
    a.push(lg("Marché public", "× " + COEF_PUBLIC + "  =  " + fmt(r.public) + " XPF"));
    if(r.maj) a.push(lg("Majoration délai", "+ " + Math.round(r.maj * 100) + " %  =  " + fmt(r.bas) + " XPF"));
    a.push(lg("ANNONCÉ AU CLIENT", mio(r.bas) + " à " + mio(r.haut) + " XPF"));
    bloc("LE CHIFFRAGE", a);
  }

  bloc("LA COMMANDE", [lg("Échéance", S.delai), lg("Cadre", S.cadre)]);

  var v = [];
  if(String(S.cadre || "").indexOf("Bon de commande") > -1)
    v.push("  Bon de commande annoncé : demandez-en une copie avant de commander la matière.");
  if(String(S.cadre || "").indexOf("Marché formalisé") > -1)
    v.push("  Marché formalisé : réclamez le dossier de consultation et la date limite de remise.");
  if(String(S.cadre || "").indexOf("acompte") > -1)
    v.push("  Acompte possible : calez-le au bon de commande, cela réduit le portage de trésorerie.");
  else
    v.push("  Aucun acompte annoncé : règlement après service fait, portage à votre charge sur toute la durée.");
  if(r && r.maj >= 0.18)
    v.push("  Délai tendu (" + S.delai + ") : vérifiez la disponibilité atelier avant de confirmer la date.");
  if(String(S.duree || "").indexOf("démontage") > -1)
    v.push("  Démontage prévu en fin d'usage : chiffrez la dépose, l'évacuation et la remise en état du site en lot séparé. Ne vous engagez sur aucun rachat des modules.");
  if(String(S.site || "").indexOf("ne connais pas") > -1)
    v.push("  Site non caractérisé : visite technique à Motu Uta avant tout devis ferme.");
  if(String(S.site || "").indexOf("horaires du port") > -1)
    v.push("  Accès soumis aux horaires portuaires : intégrez les créneaux de grutage au planning.");
  if(!PJ.length) v.push("  Plan non joint : relancez pour l'obtenir, le devis au poste près en dépend.");
  if(S.msg && String(S.msg).indexOf("?") > -1) v.push("  Elle attend des réponses : reprenez ses questions une par une.");
  bloc("POINTS DE VIGILANCE", v);

  if(S.msg) bloc("SON MESSAGE", ["  " + String(S.msg).replace(/\n/g, "\n  ")]);

  L.push(""); L.push(tir(64));
  L.push("Reçu le " + new Date().toLocaleString("fr-FR") + "  —  page dédiée Jeux 2027");
  return L.join("\n");
}

/* ============ ENVOI ============ */
function envoyer(){
  var b = document.getElementById("next");
  b.disabled = true; b.textContent = "Envoi…";
  var r = chiffrage();
  var suj = "★ JEUX 2027 — Base Motu Uta — " + (S.direction || "COJOP") + " — "
          + (libelleMod() || "") + (surface() ? " " + surface() + " m2" : "")
          + (r ? " — " + mio(r.bas) + " a " + mio(r.haut) + " XPF" : "");
  var charge = {
    _subject: suj, _template: "box", _captcha: "false", _replyto: S.mail || "",
    "Topo": topo(),
    "Nom": S.nom || "", "Direction": S.direction || "", "Telephone": S.tel || "", "Email": S.mail || "",
    "Modules": libelleMod(), "Surface": surface() ? surface() + " m2" : "",
    "Echeance": S.delai || "",
    "Fourchette annoncee": r ? (fmt(r.bas) + " a " + fmt(r.haut) + " XPF") : ""
  };
  function fin(){ idx = ordre.length - 1; b.disabled = false; rendre(); }
  envoiPJ(suj);
  try{
    fetch(RELAIS, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(charge)}).then(fin).catch(fin);
    setTimeout(function(){ if(b.disabled) fin(); }, 6000);
  }catch(e){ fin(); }
}

/* ============ DEMARRAGE ============ */
ordre = parcours();
rendre();

</script>
