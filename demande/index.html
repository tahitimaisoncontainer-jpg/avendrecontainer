<style>
:root{--navy:#1f3864;--navy2:#2c4d86;--or:#e36c0a;--vert:#1e7b34;--rouge:#c0392b;--gris:#5b6470;--bg:#eef1f6;--card:#fff;--bord:#d9e0ea;--ombre:0 2px 10px rgba(31,56,100,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#18202e;line-height:1.5;font-size:16px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header .logo{width:34px;height:34px;border-radius:8px;background:var(--or);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
header h1{margin:0;font-size:15px;font-weight:700;line-height:1.2}
header p{margin:1px 0 0;font-size:11.5px;opacity:.75}
.bar{height:4px;background:#dde3ec}
.bar i{display:block;height:100%;background:var(--or);width:0;transition:width .3s ease}
main{flex:1;padding:22px 18px 130px}
.step{display:none;animation:in .25s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--or);margin-bottom:6px}
h2{margin:0 0 6px;font-size:22px;line-height:1.25;color:var(--navy);font-weight:750}
.sub{margin:0 0 18px;font-size:14px;color:var(--gris)}
.opts{display:flex;flex-direction:column;gap:9px}
button.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bord);border-radius:12px;padding:15px 16px;font:inherit;font-size:15.5px;color:#18202e;cursor:pointer;box-shadow:var(--ombre);transition:.12s}
button.opt:hover{border-color:var(--navy2)}
button.opt.sel{border-color:var(--navy);background:#eff3fb;box-shadow:inset 0 0 0 1px var(--navy)}
button.opt .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--bord);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
button.opt.sel .ic{background:var(--navy);border-color:var(--navy)}
button.opt .tx{flex:1}
button.opt .tx small{display:block;color:var(--gris);font-size:12.5px;margin-top:2px;line-height:1.35}
label.f{display:block;margin-bottom:13px}
label.f span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#2b3646}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--bord);border-radius:11px;background:var(--card);color:#18202e}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--navy)}
textarea{min-height:88px;resize:vertical}
.err{color:var(--rouge);font-size:13px;margin-top:8px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(238,241,246,.97);backdrop-filter:blur(8px);border-top:1px solid var(--bord);padding:11px 18px calc(11px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-size:15.5px;font-weight:700;border:0;border-radius:11px;padding:14px 20px;cursor:pointer}
.btn.p{background:var(--navy);color:#fff;flex:1}
.btn.p:disabled{background:#a9b3c4;cursor:not-allowed}
.btn.s{background:transparent;color:var(--gris);padding:14px 12px;font-weight:600}
.prix{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:16px 18px;margin:16px 0 4px;box-shadow:var(--ombre)}
.prix .lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;opacity:.8}
.prix .val{font-size:29px;font-weight:800;line-height:1.15;margin:3px 0}
.prix .det{font-size:12.5px;opacity:.85}
.note{background:#fdf3e7;border-left:3px solid var(--or);padding:11px 13px;font-size:13.5px;border-radius:0 9px 9px 0;margin:14px 0}
.note b{color:#a04c05}
.grille{margin:9px 0 3px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:12.8px;align-items:baseline}
.grille i{font-style:normal;color:#6b5744;line-height:1.3}
.grille b{color:#a04c05;white-space:nowrap;text-align:right;font-weight:700}
.pj{margin:16px 0 2px}
.pjb{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--card);border:1.5px dashed #b9c3d2;border-radius:12px;padding:15px 16px;font-size:14.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:.12s}
.pjb:hover{border-color:var(--navy);background:#f6f9ff}
.pjb input{display:none}
.pja{margin:8px 2px 0;font-size:12.5px;color:var(--gris);line-height:1.45}
.pjf{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--bord);border-radius:11px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.pjf .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#18202e}
.pjf .sz{color:var(--gris);font-size:12px;white-space:nowrap}
.pjf .rm{border:0;background:transparent;font:inherit;font-size:18px;line-height:1;color:#98a2b3;cursor:pointer;padding:0 2px}
.pjf .rm:hover{color:var(--rouge)}
.pjerr{color:var(--rouge);font-size:12.8px;font-weight:600;margin-top:8px}
.recap{background:var(--card);border:1px solid var(--bord);border-radius:13px;padding:4px 16px;box-shadow:var(--ombre)}
.recap .r{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #f0f3f7;font-size:14px}
.recap .r:last-child{border:0}
.recap .r b{color:var(--gris);font-weight:600;flex:0 0 42%}
.recap .r span{text-align:right;flex:1}
.fin{text-align:center;padding:16px 0}
.fin .ok{width:66px;height:66px;border-radius:50%;background:var(--vert);color:#fff;font-size:33px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
footer{padding:16px 18px 26px;text-align:center;color:var(--gris);font-size:12px;line-height:1.6}
footer a{color:var(--navy);text-decoration:none;font-weight:600}
</style>
</head>

<script>
/* ============ PARAMETRES A AJUSTER ============ */
var SITE_ACHAT = "https://tahitimaisoncontainer-jpg.github.io/avendrecontainer/";
var RELAIS = "https://formsubmit.co/ajax/f86aed3fe4300aa72852f47498da914a";
var RELAIS_PJ = "https://formsubmit.co/f86aed3fe4300aa72852f47498da914a"; /* les pieces jointes ne passent que par ce point d entree */ /* identifiant chiffre : votre adresse mail n'apparait pas dans la page */

/* ============ TARIFS (identiques a la page de vente) ============ */
var BASE20 = 623451, BASE40 = 832451;
var COM = [
 ["Papeete",0,0],["Pirae",23892,28908],["Faa'a",23892,28908],["Arue",23892,28908],
 ["Punaauia",28908,47760],["Mahina",28908,47760],["Paea",35192,72897],["Tiarei",35192,72897],
 ["Papenoo",35192,72897],["Papara",47760,91750],["Hitiaa",47760,91750],["Mahaena",47760,91750],
 ["Mataiea",56559,106832],["Papeari",60329,109346],["Faaone",66000,111860],["Taravao",69127,113117],
 ["Toahotu",70384,115630],["Afaahiti",70384,115630],["Vairao",71641,116888],["Pueu",71641,116888],
 ["Teahupoo",75411,123171],["Tautira",75411,123171],["Moorea",90000,160000],
 ["Raiatea (au quai)",50000,95000],["Bora-Bora (au quai)",50000,95000],["Tahaa (au quai)",50000,95000],
 ["Autre île",-1,-1]
];
var ETUDE = [
 [60,"25 245 XPF"],[120,"45 499 XPF"],[180,"70 698 XPF"],[240,"90 783 XPF"],[9999,"120 042 XPF"]
];

/* ============ ETAT ============ */
var S = {}, idx = 0, ordre = [];

function fmt(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function comInfo(nom){ for(var i=0;i<COM.length;i++) if(COM[i][0]===nom) return COM[i]; return null; }

function prixUnitaire(){
  var c = comInfo(S.commune); if(!c) return null;
  if(c[1] === -1) return "devis";
  if(S.format === "20 DRY") return BASE20 + c[1];
  if(S.format === "40 HC")  return BASE40 + c[2];
  return null;
}
function prixTotal(){
  var u = prixUnitaire(); if(u === null || u === "devis") return u;
  var q = parseInt(S.quantite,10); if(!q || q < 1) q = 1;
  return u * q;
}
function tarifEtude(){
  var m = parseFloat(String(S.surface||"").replace(",","."));
  if(!m || m <= 0) return null;
  for(var i=0;i<ETUDE.length;i++) if(m <= ETUDE[i][0]) return ETUDE[i][1];
  return null;
}

/* ============ ECRANS ============ */
var E = {};

E.profil = {k:"Pour commencer", q:"Vous êtes…", ch:"profil", o:[
  ["Un particulier"],["Une entreprise"],["Une administration ou une commune"],["Une association"]]};

E.besoin = {k:"Votre besoin", q:"Que puis-je faire pour vous ?", ch:"besoin", o:[
  ["Aménager un conteneur","Logement, bureau, local technique. C'est l'objet de cette page."],
  ["Prendre rendez-vous","Pour en parler de vive voix, sur place ou chez vous."],
  ["Acheter un conteneur brut","Livré tel quel, sans aménagement. Prix et commande en ligne."]]};

E.redirection = {k:"Conteneur brut", q:"Tout est déjà en ligne", redirect:1,
  sub:"Pour un conteneur livré tel quel, le prix de votre commune s'affiche directement sur notre page conteneurs, et vous commandez depuis cette page. Inutile de remplir un questionnaire."};

E.commune = {k:"Le lieu", q:"Où le projet sera-t-il installé ?", sel:"commune",
  sub:"L'île et la commune déterminent le transport et les conditions d'accès."};

E.acces = {k:"Livraison", q:"Un camion-grue peut-il accéder à l'emplacement ?", ch:"acces",
  sub:"C'est le point qui fait échouer le plus de livraisons.", o:[
  ["Oui, l'accès est dégagé"],["Non, l'accès est difficile"],["Je ne sais pas"]]};

E.delai = {k:"Calendrier", q:"Pour quand ?", ch:"delai", o:[
  ["Dans le mois"],["Dans 1 à 3 mois"],["Dans 3 à 6 mois"],["Dans plus de 6 mois"],
  ["Pas de date, je me renseigne"]]};

/* ---- branche AMENAGEMENT ---- */
E.usage = {k:"Votre projet", q:"Quel usage prévoyez-vous ?", ch:"usage", o:[
  ["Logement","Studio, chambre, maison"],
  ["Bureau ou local commercial","Bureau, boutique, kiosque"],
  ["Atelier ou stockage aménagé","Isolé, électrifié"],
  ["Local technique","Sanitaires, chambre froide, laboratoire"],
  ["Autre usage"]]};

E.surface = {k:"Votre projet", q:"Quelle surface envisagez-vous ?", num:"surface",
  sub:"Une valeur approximative suffit. Repères : un 20 pieds fait 13 m², un 40 pieds 26 m²."};

E.terrain = {k:"Le terrain", q:"Où en êtes-vous avec le terrain ?", ch:"terrain", o:[
  ["Il m'appartient ou je le loue"],
  ["Achat ou bail en cours de signature"],
  ["Je l'ai repéré, il n'est pas encore à moi"],
  ["Je n'ai pas encore de terrain"]]};

E.indivision = {k:"Le terrain", q:"Le terrain est-il en indivision ?", ch:"indivision",
  sub:"C'est le premier motif d'enlisement des projets en Polynésie. Autant le savoir tout de suite.", o:[
  ["Non, je suis seul propriétaire ou titulaire du bail"],
  ["Oui, et l'indivision est réglée","J'ai l'accord écrit des indivisaires"],
  ["Oui, et elle n'est pas réglée"],
  ["Je ne sais pas"]]};

E.parcelle = {k:"Le terrain", q:"Le numéro de votre parcelle", txt:"parcelle",
  sub:"Il se trouve en quelques secondes sur otia.gov.pf. Facultatif, mais il me fait gagner un aller-retour.", opt:1};

E.plan = {k:"Votre projet", q:"Avez-vous un plan ou un croquis ?", ch:"plan", pj:1,
  reperes:"Un croquis à main levée photographié me suffit pour démarrer : joignez-le ci-dessous.<br>Si vous n'avez rien, je fais établir le plan. Le tarif dépend du nombre et de la taille des conteneurs, en XPF :<div class='grille'><i>Plan 2D coté — 1 conteneur 20 pieds</i><b>35 800</b><i>Plan 2D coté — 1 conteneur 40 pieds</i><b>53 700</b><i>Chaque 20 pieds supplémentaire</i><b>+ 17 900</b><i>Chaque 40 pieds supplémentaire</i><b>+ 29 900</b><i>Visuel 3D en option — 1 conteneur 20 pieds</i><b>47 800</b><i>Visuel 3D en option — 1 conteneur 40 pieds</i><b>65 700</b><i>Chaque 20 / 40 pieds supplémentaire</i><b>+ 23 900 / 35 800</b></div>Le plan 2D me sert à chiffrer votre projet au poste près, et il constitue votre <b>dossier de permis de construire ou de permis de travaux</b>. Le visuel 3D vous montre le rendu final avant que je commence. Ces montants sont déduits de votre commande si vous donnez suite.", o:[
  ["Oui, un plan coté"],["Un croquis à main levée"],["Non, rien pour l'instant"]]};

E.enveloppe = {k:"Budget", q:"Dans quelle enveloppe souhaitez-vous rester ?", ch:"enveloppe", etudeNote:1,
  sub:"Aucun tarif ne s'affiche automatiquement ici, et c'est volontaire : le prix dépend du type de projet, de la surface, du lieu, de la difficulté de pose, des matériaux et du calendrier.",
  reperes:"Ordres de grandeur relevés sur mes devis réels, conteneur, transport, matériaux et main-d'œuvre compris :<div class='grille'><i>Aménagement seul, conteneur déjà sur place</i><b>1,5 – 2 M</b><i>Bureau ou pièce à vivre, 20 pieds (15 m²)</i><b>3 – 4,5 M</b><i>Sanitaires ou vestiaires, 20 pieds</i><b>2,5 – 3,5 M</b><i>Bureau ou studio, 40 pieds (28 m²)</i><b>6 – 7 M</b><i>Local professionnel aux normes, 2 × 40 pieds</i><b>9 – 10 M</b><i>Maison 3 chambres ~80 m², 3 × 40 pieds</i><b>17 – 20 M</b><i>Bâtiment de 6 à 9 conteneurs</i><b>50 – 80 M</b></div>Ce sont des repères, pas des prix fermes : le vôtre dépend du lieu, de l'accès au terrain, des matériaux et du calendrier.", o:[
  ["Moins de 3 millions XPF"],["De 3 à 6 millions"],["De 6 à 12 millions"],
  ["Plus de 12 millions"],["Je préfère en discuter"]]};

E.financement = {k:"Budget", q:"Comment envisagez-vous de financer ce projet ?", ch:"financement",
  sub:"Cette question me sert à adapter le calendrier de facturation à votre situation.", o:[
  ["Fonds propres disponibles"],["Prêt bancaire déjà accordé"],["Aide ou subvention notifiée"],
  ["Prêt en cours d'instruction"],["Le financement reste à monter"],["Je ne sais pas encore"]]};

/* ---- branche RDV ---- */
E.rdvlieu = {k:"Rendez-vous", q:"Où souhaitez-vous qu'on se voie ?", ch:"rdvlieu", o:[
  ["Chez vous, à Tahiti Maison Container","Domaine Vaitarua, Afaahiti"],
  ["Sur mon terrain ou à mon bureau","Déplacement facturé 5 000 XPF sur Tahiti"],
  ["Par téléphone ou en visio"]]};

E.rdvquand = {k:"Rendez-vous", q:"Quel moment vous arrange ?", ch:"rdvquand", o:[
  ["En semaine, le matin"],["En semaine, l'après-midi"],["Le samedi"],["Peu importe, appelez-moi"]]};

/* ---- commun fin ---- */
E.decision = {k:"Presque fini", q:"Qui décide avec vous ?", ch:"decision", o:[
  ["Je décide seul"],
  ["Avec mon conjoint ou ma famille, nous sommes d'accord sur le principe"],
  ["Avec mon conjoint ou ma famille, nous n'en avons pas encore parlé"],
  ["Avec un associé, un conseil ou ma hiérarchie"],
  ["Je me renseigne pour quelqu'un d'autre"]]};

E.etape = {k:"Presque fini", q:"Si ma proposition vous convient, quelle serait votre prochaine étape ?", ch:"etape", o:[
  ["Je commande"],
  ["J'en parle autour de moi, puis je reviens vers vous"],
  ["Je compare avec d'autres devis"],
  ["Je garde la proposition pour plus tard"]]};

E.contact = {k:"Vos coordonnées", q:"Comment je vous recontacte ?", contact:1,
  sub:"Je réponds sous 48 heures, et sous 24 heures si votre projet est urgent."};

E.recap = {k:"C'est prêt", q:"Vérifiez avant d'envoyer", recap:1};
E.fini = {k:"", q:"", fini:1};

/* ============ PARCOURS ============ */
function parcours(){
  var p = ["profil","besoin"];
  if(S.besoin === "Acheter un conteneur brut"){
    return ["profil","besoin","redirection"];
  } else if(S.besoin === "Aménager un conteneur"){
    p = p.concat(["usage","surface","commune","terrain"]);
    if(S.terrain === "Il m'appartient ou je le loue" || S.terrain === "Achat ou bail en cours de signature") p.push("indivision");
    p = p.concat(["parcelle","acces","plan","delai","enveloppe","financement","decision","etape","contact","recap"]);
  } else if(S.besoin === "Prendre rendez-vous"){
    p = p.concat(["rdvlieu","rdvquand","usage","delai","contact","recap"]);
  }
  p.push("fini");
  return p;
}

/* ============ NOTATION ============ */
function noter(){
  var A=0,B=0,C=0,D=0,Ee=0,F=8, dr=[];
  if(S.besoin === "Acheter un conteneur brut"){
    A = (S.format === "Je ne sais pas encore") ? 6 : 16;
    if(S.quantite) A += 2;
  } else if(S.besoin === "Aménager un conteneur"){
    A = 6;
    if(S.usage && S.usage !== "Autre usage") A += 5;
    if(S.surface) A += 3;
    if(S.plan === "Oui, un plan coté") A += 6;
    else if(S.plan === "Un croquis à main levée") A += 3;
  } else {
    A = 6;
    if(S.usage && S.usage !== "Autre usage") A += 4;
    if(S.rdvlieu) A += 2;
  }
  A = Math.min(20, A);

  var c = comInfo(S.commune);
  if(S.besoin === "Prendre rendez-vous") B = 8;
  else if(!c) B = 0;
  else if(c[1] === -1) B = 6;
  else B = 10;
  if(S.terrain === "Il m'appartient ou je le loue") B = 12;
  else if(S.terrain === "Achat ou bail en cours de signature") B = 9;
  else if(S.terrain === "Je l'ai repéré, il n'est pas encore à moi") B = 4;
  else if(S.terrain === "Je n'ai pas encore de terrain") B = 0;
  if(S.acces === "Oui, l'accès est dégagé") B += 3;
  if(S.acces === "Non, l'accès est difficile") B = Math.min(B, 7);
  if(S.parcelle && S.parcelle.length > 2) B += 2;
  B = Math.max(0, Math.min(15, B));

  if(S.budget === "Oui, c'est dans mon budget") C = 22;
  else if(S.budget === "Un peu au-dessus, mais je peux ajuster") C = 12;
  else if(S.budget === "Non, c'est trop élevé pour moi") { C = 3; dr.push("budget refusé"); }
  else if(S.budget) C = 7;
  var envOK = S.enveloppe && S.enveloppe !== "Je préfère en discuter";
  if(envOK) C = Math.max(C, 15);
  var fin_ = S.financement;
  if(fin_ === "Fonds propres disponibles" || fin_ === "Prêt bancaire déjà accordé"
     || fin_ === "Aide ou subvention notifiée") C = Math.max(C, envOK ? 25 : 10);
  else if(fin_ === "Prêt en cours d'instruction") C = Math.max(C, envOK ? 18 : 8);
  else if(fin_ === "Le financement reste à monter") C = Math.max(C, envOK ? 14 : 5);
  if(S.besoin === "Prendre rendez-vous" && !S.budget && !S.enveloppe) C = 10;
  C = Math.min(25, C);

  if(S.delai === "Dans le mois") D = 15;
  else if(S.delai === "Dans 1 à 3 mois") D = 13;
  else if(S.delai === "Dans 3 à 6 mois") D = 9;
  else if(S.delai === "Dans plus de 6 mois") D = 4;
  else D = 0;

  if(S.decision === "Je décide seul") Ee = 10;
  else if(S.decision && S.decision.indexOf("d'accord sur le principe") > -1) Ee = 8;
  else if(S.decision && S.decision.indexOf("pas encore parlé") > -1) Ee = 4;
  else if(S.decision && S.decision.indexOf("associé") > -1) Ee = 4;
  else if(S.decision && S.decision.indexOf("quelqu'un d'autre") > -1) Ee = 0;
  else Ee = 6;

  if(S.etape === "Je commande") F = 15;
  else if(S.etape && S.etape.indexOf("j'en parle") > -1) F = 12;
  else if(S.etape && S.etape.indexOf("compare") > -1) F = 10;
  else if(S.etape && S.etape.indexOf("plus tard") > -1) F = 5;
  if(S.besoin === "Prendre rendez-vous") F = Math.max(F, 13);
  if(S.plan === "Oui, un plan coté") F = Math.min(15, F + 2);
  F = Math.min(15, F);

  if(S.indivision === "Oui, et elle n'est pas réglée") dr.push("indivision non réglée");
  if(S.acces === "Non, l'accès est difficile") dr.push("accès camion-grue difficile");

  var sc = Math.max(0, Math.min(100, A+B+C+D+Ee+F));
  var n = sc >= 85 ? 5 : sc >= 70 ? 4 : sc >= 45 ? 3 : sc >= 25 ? 2 : 1;
  if(S.budget === "Non, c'est trop élevé pour moi" && n > 2) n = 2;
  if(S.indivision === "Oui, et elle n'est pas réglée" && n > 4) n = 4;
  if(S.terrain === "Je n'ai pas encore de terrain" && n > 3) n = 3;
  if(S.terrain === "Je l'ai repéré, il n'est pas encore à moi" && n > 3) n = 3;
  var noms = ["","Froid","À qualifier","Sérieux","Chaud","Prioritaire"];
  return {score:sc, niveau:n, nom:noms[n], detail:"A"+A+" B"+B+" C"+C+" D"+D+" E"+Ee+" F"+F,
          drapeaux:dr.join(", ")};
}

/* ============ PIECES JOINTES ============ */
var PJ = [], PJMAX = 6, PJUN = 4 * 1024 * 1024, PJTOT = 9 * 1024 * 1024;

function poids(o){ return o < 1048576 ? Math.max(1, Math.round(o/1024)) + " Ko" : (o/1048576).toFixed(1).replace(".",",") + " Mo"; }
function totalPJ(){ var t=0; for(var i=0;i<PJ.length;i++) t += PJ[i].blob.size; return t; }

function listePJ(){
  var h = "";
  for(var i=0;i<PJ.length;i++)
    h += '<div class="pjf"><span class="nm">' + esc(PJ[i].nom) + '</span>'
       + '<span class="sz">' + poids(PJ[i].blob.size) + '</span>'
       + '<button class="rm" type="button" title="Retirer" onclick="retirePJ(' + i + ')">×</button></div>';
  if(PJ.length) h += '<p class="pja">' + PJ.length + (PJ.length>1?" fichiers joints, ":" fichier joint, ")
       + poids(totalPJ()) + ' au total.</p>';
  if(window.PJMSG) h += '<div class="pjerr">' + esc(PJMSG) + '</div>';
  return h;
}
function rafraichirPJ(){ var z=document.getElementById("pjliste"); if(z) z.innerHTML = listePJ(); }
function retirePJ(i){ PJ.splice(i,1); PJMSG=""; rafraichirPJ(); }

function compresse(f){
  return new Promise(function(res){
    if(String(f.type).indexOf("image/") !== 0 || f.type === "image/gif"){ res({nom:f.name, blob:f}); return; }
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function(){
      try{
        var M = 1600, r = Math.min(1, M / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(b){
          URL.revokeObjectURL(url);
          if(b && b.size < f.size) res({nom:String(f.name).replace(/\.[^.]+$/,"") + ".jpg", blob:b});
          else res({nom:f.name, blob:f});
        }, "image/jpeg", 0.72);
      }catch(err){ URL.revokeObjectURL(url); res({nom:f.name, blob:f}); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res({nom:f.name, blob:f}); };
    img.src = url;
  });
}

function ajoutPJ(input){
  var fs = Array.prototype.slice.call(input.files || []);
  input.value = "";
  if(!fs.length) return;
  PJMSG = "";
  var z = document.getElementById("pjliste");
  if(z) z.innerHTML = '<p class="pja">Préparation des fichiers…</p>';
  Promise.all(fs.map(compresse)).then(function(prets){
    for(var i=0;i<prets.length;i++){
      var f = prets[i];
      if(PJ.length >= PJMAX){ PJMSG = "6 fichiers au maximum. Les suivants n'ont pas été ajoutés."; break; }
      if(f.blob.size > PJUN){ PJMSG = f.nom + " dépasse 4 Mo et n'a pas pu être joint. Envoyez-le-moi par mail après votre demande."; continue; }
      if(totalPJ() + f.blob.size > PJTOT){ PJMSG = "Limite de 9 Mo atteinte. " + f.nom + " n'a pas été ajouté."; continue; }
      PJ.push(f);
    }
    rafraichirPJ();
  }).catch(function(){ PJMSG = "Un fichier n'a pas pu être lu."; rafraichirPJ(); });
}

function envoiPJ(sujet){
  if(!PJ.length) return;
  try{
    var fd = new FormData();
    fd.append("_subject", "Pièces jointes — " + sujet);
    fd.append("_template", "box");
    fd.append("_captcha", "false");
    fd.append("Rappel", "Ces fichiers accompagnent la demande de " + (S.nom||"sans nom")
      + (S.tel ? " — " + S.tel : "") + (S.mail ? " — " + S.mail : "") + ".");
    fd.append("Nombre", PJ.length + (PJ.length>1 ? " fichiers" : " fichier"));
    /* un nom de champ distinct par fichier : le relais n en garde qu un seul si les noms sont identiques */
    for(var i=0;i<PJ.length;i++) fd.append(i ? "attachment" + (i+1) : "attachment", PJ[i].blob, PJ[i].nom);
    fetch(RELAIS_PJ, {method:"POST", mode:"no-cors", body:fd});
  }catch(e){}
}

  L.push(""); L.push("CE QU'IL FAUT FAIRE"); L.push(tir(19));
  for(var i=0;i<N.a.length;i++) L.push("  "+(i+1)+". "+N.a[i]);

  bloc("LE CLIENT",[lg("",(S.nom||"sans nom")+(S.structure?"  —  "+S.structure:"")),
    lg("",S.profil),lg("Téléphone",S.tel),lg("Email",S.mail)]);

  var pr=[lg("Besoin",S.besoin),lg("Usage",S.usage),lg("Surface",S.surface?S.surface+" m²":""),
    lg("Format",S.format?S.format+(S.quantite?"  ×"+S.quantite:""):""),lg("Lieu",S.commune)];
  var t=prixTotal(); if(t&&t!=="devis") pr.push(lg("Prix livré",fmt(t)+" XPF TTC"));
  pr=pr.concat([lg("Terrain",S.terrain),lg("Indivision",S.indivision),lg("Parcelle",S.parcelle),
    lg("Accès grue",S.acces),lg("Plan",S.plan),
    lg("Fichiers joints",PJ.length?(PJ.length+(PJ.length>1?" fichiers envoyés dans un second mail":" fichier envoyé dans un second mail")):""),
    lg("Échéance",S.delai),
    lg("Lieu du RDV",S.rdvlieu),lg("Moment",S.rdvquand)]);
  bloc("LE PROJET",pr);

  var ar=[lg("Budget",S.budget),lg("Enveloppe",S.enveloppe),lg("Financement",S.financement)];
  var et=tarifEtude(); if(et) ar.push(lg("Étude applicable",et+"  (déduite de la commande)"));
  bloc("L'ARGENT",ar);
  bloc("LA DÉCISION",[lg("Décide",S.decision),lg("Prochaine étape",S.etape)]);
  if(S.msg) bloc("SON MESSAGE",["  "+String(S.msg).replace(/\n/g,"\n  ")]);

  var v=vigilance(); if(r.drapeaux) v.unshift("  ⚑ "+r.drapeaux);
  bloc("POINTS DE VIGILANCE",v.length?v:["  Aucun."]);
  bloc("RÉPONSE PRÊTE À COPIER",["",REP[r.niveau].replace("[P]",String(S.nom||"").trim().split(" ")[0]||"")]);

  L.push(""); L.push(tir(64));
  L.push("Notation : "+r.detail);
  L.push("Reçu le "+new Date().toLocaleString("fr-FR")+"  —  page de demande TMC");
  return L.join("\n");
}

function accuse(r){
  var p = String(S.nom||"").trim().split(" ")[0] || "";
  var L = ["Bonjour " + p + ",", "", "J'ai bien reçu votre demande, merci d'avoir pris le temps de la détailler."];
  var terrainOK = (S.terrain === "Il m'appartient ou je le loue" || S.terrain === "Achat ou bail en cours de signature"
                   || S.besoin !== "Aménager un conteneur");
  var budgetOK = (S.enveloppe && S.enveloppe !== "Je préfère en discuter")
                 || (S.budget && S.budget.indexOf("Oui") === 0)
                 || (S.budget && S.budget.indexOf("ajuster") > -1);
  if(r.niveau >= 4 && terrainOK && budgetOK)
    L.push("Votre projet est complet : je vous appelle dans les 24 heures, et vous recevrez une proposition chiffrée dans la foulée.");
  else if(r.niveau >= 3 && terrainOK && budgetOK)
    L.push("Je vous prépare une estimation chiffrée que vous recevrez sous 48 heures, puis je vous appelle pour caler les derniers points.");
  else
    L.push("Je reviens vers vous sous 48 heures. Pour vous répondre avec un chiffre juste plutôt qu'une moyenne, il me manquera sans doute quelques précisions : je vous dirai lesquelles.");
  L.push(""); L.push("Voici ce que vous m'avez transmis :");
  var a = lignesRecap();
  for(var i=0;i<a.length;i++) L.push("   " + a[i][0] + " : " + a[i][1]);
  var et = tarifEtude();
  if(et){ L.push("");
    L.push("Pour votre information : pour aller jusqu'au plan coté et au chiffrage poste par poste, l'étude de votre projet est facturée " + et + ", intégralement déduite de votre commande si vous donnez suite. Je ne vous la proposerai qu'après notre premier échange, jamais avant.");
  }
  L.push(""); L.push("Si votre projet est urgent, appelez-moi directement au 87 22 65 55.");
  L.push(""); L.push("Bien cordialement,");
  L.push("Jean-Baptiste HAUATA");
  L.push("Tahiti Maison Container — N° Tahiti 710194");
  L.push("87 22 65 55 — tahitimaisoncontainer@gmail.com");
  L.push("Domaine Vaitarua, Afaahiti, Taiarapu-Est");
  return L.join("\n");
}

function objet(r){
  var N=NIV[r.niveau], res=(S.usage||S.format||S.besoin||"");
  if(S.surface) res+=" "+S.surface+" m2";
  if(S.commune) res+=" a "+S.commune;
  return (N.e?N.e+" ":"")+N.t+" ("+r.score+"/100) — "+(S.nom||"sans nom")+" — "+res;
}

/* ============ ENVOI ============ */
function envoyer(){
  var b = document.getElementById("next");
  b.disabled = true; b.textContent = "Envoi…";
  var r = noter();
  var t = prixTotal();
  var charge = {
    _subject : objet(r),
    _template: "box",
    _captcha : "false",
    _replyto : S.mail || "",
    _autoresponse : accuse(r),
    "Topo"   : topo(r),
    "Nom"    : S.nom || "",
    "Telephone": S.tel || "",
    "Email"  : S.mail || "",
    "Niveau" : r.niveau + " — " + r.nom,
    "Score"  : r.score + "/100",
    "Besoin" : S.besoin || "",
    "Lieu"   : S.commune || "",
    "Prix"   : (t && t !== "devis") ? fmt(t) + " XPF" : ""
  };
  function fin(){ idx = ordre.length - 1; b.disabled = false; rendre(); }
  envoiPJ(objet(r));
  try{
    fetch(RELAIS, {method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(charge)}).then(fin).catch(fin);
    setTimeout(function(){ if(b.disabled) fin(); }, 6000);
  }catch(e){ fin(); }
}

/* ============ DEMARRAGE ============ */
ordre = parcours();
rendre();
</script>
