/* ============ TARIFS (identiques a la page de vente) ============ */
var BASE20 = 623451, BASE40 = 832451;
var COM = [
 ["Papeete",0,0],["Pirae",23892,28908],["Faa'a",23892,28908],["Arue",23892,28908],
 ["Punaauia",28908,47760],["Mahina",28908,47760],["Paea",35192,72897],["Tiarei",35192,72897],
 ["Papenoo",35192,72897],["Papara",47760,91750],["Hitiaa",47760,91750],["Mahaena",47760,91750],
 ["Mataiea",56559,106832],["Papeari",60329,109346],["Faaone",66000,111860],["Taravao",69127,113117],
 ["Toahotu",70384,115630],["Afaahiti",70384,115630],["Vairao",71641,116888],["Pueu",71641,116888],
 ["Teahupoo",75411,123171],["Tautira",75411,123171],["Moorea",90000,160000],
 ["Raiatea (au quai)",50000,95000],["Bora-Bora (au quai)",50000,95000],["Tahaa (au quai)",50000,95000],
 ["Autre île",-1,-1]
];
var ETUDE = [
 [60,"25 245 XPF"],[120,"45 499 XPF"],[180,"70 698 XPF"],[240,"90 783 XPF"],[9999,"120 042 XPF"]
];

/* ============ ETAT ============ */
var S = {}, idx = 0, ordre = [];

function fmt(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function comInfo(nom){ for(var i=0;i<COM.length;i++) if(COM[i][0]===nom) return COM[i]; return null; }

function prixUnitaire(){
  var c = comInfo(S.commune); if(!c) return null;
  if(c[1] === -1) return "devis";
  if(S.format === "20 DRY") return BASE20 + c[1];
  if(S.format === "40 HC")  return BASE40 + c[2];
  return null;
}
function prixTotal(){
  var u = prixUnitaire(); if(u === null || u === "devis") return u;
  var q = parseInt(S.quantite,10); if(!q || q < 1) q = 1;
  return u * q;
}
function tarifEtude(){
  var m = parseFloat(String(S.surface||"").replace(",","."));
  if(!m || m <= 0) return null;
  for(var i=0;i<ETUDE.length;i++) if(m <= ETUDE[i][0]) return ETUDE[i][1];
  return null;
}

/* ============ ECRANS ============ */
var E = {};

E.profil = {k:"Pour commencer", q:"Vous êtes…", ch:"profil", o:[
  ["Un particulier"],["Une entreprise"],["Une administration ou une commune"],["Une association"]]};

E.besoin = {k:"Votre besoin", q:"Que puis-je faire pour vous ?", ch:"besoin", o:[
  ["Aménager un conteneur","Logement, bureau, local technique. C'est l'objet de cette page."],
  ["Prendre rendez-vous","Pour en parler de vive voix, sur place ou chez vous."],
  ["Acheter un conteneur brut","Livré tel quel, sans aménagement. Prix et commande en ligne."]]};

E.redirection = {k:"Conteneur brut", q:"Tout est déjà en ligne", redirect:1,
  sub:"Pour un conteneur livré tel quel, le prix de votre commune s'affiche directement sur notre page conteneurs, et vous commandez depuis cette page. Inutile de remplir un questionnaire."};

E.commune = {k:"Le lieu", q:"Où le projet sera-t-il installé ?", sel:"commune",
  sub:"L'île et la commune déterminent le transport et les conditions d'accès."};

E.acces = {k:"Livraison", q:"Un camion-grue peut-il accéder à l'emplacement ?", ch:"acces",
  sub:"C'est le point qui fait échouer le plus de livraisons.", o:[
  ["Oui, l'accès est dégagé"],["Non, l'accès est difficile"],["Je ne sais pas"]]};

E.delai = {k:"Calendrier", q:"Pour quand ?", ch:"delai", o:[
  ["Dans le mois"],["Dans 1 à 3 mois"],["Dans 3 à 6 mois"],["Dans plus de 6 mois"],
  ["Pas de date, je me renseigne"]]};

/* ---- branche AMENAGEMENT ---- */
E.usage = {k:"Votre projet", q:"Quel usage prévoyez-vous ?", ch:"usage", o:[
  ["Logement","Studio, chambre, maison, logement locatif"],
  ["Bureau ou activité professionnelle","Bureau, commerce, boutique, cabinet, kiosque"],
  ["Hébergement ou tourisme","Bungalow, hébergement touristique, unité locative"],
  ["Atelier ou stockage aménagé","Atelier, stockage, local isolé ou électrifié"],
  ["Sanitaire ou local spécialisé","Sanitaires, vestiaires, chambre froide, laboratoire, local technique"],
  ["Autre projet"]]};

E.modules = {k:"Votre projet", q:"Combien de conteneurs votre projet comporte-t-il ?", mod:1,
  sub:"Un même usage peut demander un seul module ou plusieurs. Tout ce qui suit — surface, plans, budget — portera sur <b>l'ensemble</b> du projet, jamais sur un module isolé."};

E.implantation = {k:"Votre projet", q:"Comment ces modules seront-ils implantés ?", ch:"implantation",
  sub:"Assembler des conteneurs et en poser plusieurs séparément ne coûtent pas la même chose : jonctions et reprises d'étanchéité d'un côté, équipements et raccordements dupliqués de l'autre.", o:[
  ["Assemblés en un seul bâtiment","Ouvertures entre les modules, un seul volume habitable"],
  ["Séparés, posés indépendamment","Chaque module fonctionne seul, sur le même terrain ou sur plusieurs sites"],
  ["Superposés, avec un étage","Structure porteuse, escalier ou coursive"],
  ["Je ne sais pas encore","Nous le déterminerons ensemble"]]};

E.surface = {k:"Votre projet", q:"Quelle surface envisagez-vous ?", num:"surface", gabarit:1,
  sub:"Indiquez la surface au sol <b>totale</b> du projet, tous modules additionnés. Voici de quoi vous repérer, à l'échelle :"};

E.terrain = {k:"Le terrain", q:"Où en êtes-vous avec le terrain ?", ch:"terrain", o:[
  ["Il m'appartient ou je le loue"],
  ["Achat ou bail en cours de signature"],
  ["Je l'ai repéré, il n'est pas encore à moi"],
  ["Je n'ai pas encore de terrain"]]};

E.indivision = {k:"Le terrain", q:"Le terrain est-il en indivision ?", ch:"indivision",
  sub:"C'est le premier motif d'enlisement des projets en Polynésie. Autant le savoir tout de suite.", o:[
  ["Non, je suis seul propriétaire ou titulaire du bail"],
  ["Oui, et l'indivision est réglée","J'ai l'accord écrit des indivisaires"],
  ["Oui, et elle n'est pas réglée"],
  ["Je ne sais pas"]]};

E.parcelle = {k:"Le terrain", q:"Le numéro de votre parcelle", txt:"parcelle",
  sub:"Il se trouve en quelques secondes sur otia.gov.pf. Facultatif, mais il me fait gagner un aller-retour.", opt:1};

E.plan = {k:"Votre projet", q:"Avez-vous un plan ou un croquis ?", ch:"plan", pj:1,
  reperes:"Un croquis à main levée photographié me suffit pour démarrer : joignez-le ci-dessous.<br>Si vous n'avez rien, je fais établir le plan. Tarifs en XPF :<div class='grille'><em>Plan 2D coté</em><i>1 conteneur 20 pieds</i><b>35 800</b><i>1 conteneur 40 pieds</i><b>53 700</b><i>Par conteneur 20 pieds en plus</i><b>+ 17 900</b><i>Par conteneur 40 pieds en plus</i><b>+ 29 900</b><em>Visuel 3D &nbsp;·&nbsp; en option</em><i>1 conteneur 20 pieds</i><b>47 800</b><i>1 conteneur 40 pieds</i><b>65 700</b><i>Par conteneur 20 pieds en plus</i><b>+ 23 900</b><i>Par conteneur 40 pieds en plus</i><b>+ 35 800</b></div><b>Le plan 2D</b> me sert à chiffrer votre projet au poste près, et il constitue votre dossier de permis de construire ou de permis de travaux.<br><b>Le visuel 3D</b> vous montre le rendu final de votre projet avant que je commence.<br>Ces deux prestations sont facturées à part, avant le lancement des travaux.", o:[
  ["Oui, un plan coté"],["Un croquis à main levée"],["Non, rien pour l'instant"]]};

E.enveloppe = {k:"Budget", q:"Quel budget avez-vous prévu pour votre projet ?", ch:"enveloppe", etudeNote:1, echelle:1,
  sub:"Indiquez le budget de <b>l'ensemble du projet</b> : les conteneurs et leur aménagement, tous modules compris. Cette information me permet de vérifier que votre projet est cohérent avec l'enveloppe que vous envisagez. Une estimation réaliste du budget est indispensable avant l'établissement d'un devis.", o:[
  ["2 à 3 millions XPF","Aménagement simple d'un seul module"],
  ["3 à 5 millions XPF","Un module entièrement aménagé et équipé"],
  ["5 à 10 millions XPF","Un grand module abouti, ou deux modules"],
  ["10 à 20 millions XPF","Trois à quatre modules, ou un ensemble de plusieurs pièces"],
  ["20 à 30 millions XPF","Projet résidentiel ou professionnel de grande taille"],
  ["30 à 50 millions XPF","Bâtiment complet ou ensemble de modules important"],
  ["50 millions XPF et plus","Programme complet, plusieurs bâtiments ou tranche importante"],
  ["Je ne sais pas encore, j'ai besoin d'être conseillé","Je vous situe au premier échange"]]};

E.financement = {k:"Budget", q:"Comment envisagez-vous de financer ce projet ?", ch:"financement", multi:1,
  sub:"Plusieurs réponses possibles : beaucoup de projets combinent plusieurs sources. Cette question me sert à adapter le calendrier de facturation à votre situation.", o:[
  ["Fonds propres disponibles"],
  ["Prêt bancaire déjà accordé"],
  ["Aide ou subvention notifiée"],
  ["Prêt en cours d'instruction"],
  ["Le financement reste à monter"],
  ["Je ne sais pas encore", "", 1]]};

/* ---- branche RDV ---- */
E.rdvlieu = {k:"Rendez-vous", q:"Où souhaitez-vous qu'on se voie ?", ch:"rdvlieu", o:[
  ["Sur mon terrain ou à mon bureau","Je me déplace. Déplacement facturé à partir de 5 000 XPF selon la commune."],
  ["Par téléphone ou en visio","Le plus rapide pour dégrossir le projet."]]};

E.rdvquand = {k:"Rendez-vous", q:"Quel moment vous arrange ?", ch:"rdvquand", o:[
  ["En semaine, le matin"],["En semaine, l'après-midi"],["Le samedi"],["Peu importe, appelez-moi"]]};

/* ---- commun fin ---- */
E.decision = {k:"Presque fini", q:"Qui décide du projet avec vous ?", ch:"decision", o:[
  ["Je décide seul","Décision personnelle"],
  ["Nous décidons en couple ou en famille","Le principe est déjà validé entre nous"],
  ["Nous n'en avons pas encore parlé","Discussion à venir"],
  ["Je décide avec un associé ou ma hiérarchie","Validation interne à obtenir"],
  ["Je fais la demande pour quelqu'un d'autre","Je ne suis pas le décideur"]]};

E.etape = {k:"Presque fini", q:"Si ma proposition vous convient, quelle serait votre prochaine étape ?", ch:"etape", o:[
  ["Je commande"],
  ["J'en parle autour de moi, puis je reviens vers vous"],

  ["Je garde la proposition pour plus tard"]]};

E.contact = {k:"Vos coordonnées", q:"Vos coordonnées pour recevoir votre proposition", contact:1,
  sub:"Je réponds sous 48 heures, et sous 24 heures si votre projet est urgent. Profitez du dernier champ pour me poser vos questions : j'y réponds une par une.",
  confid:1};

E.recap = {k:"C'est prêt", q:"Vérifiez avant d'envoyer", recap:1};
E.fini = {k:"", q:"", fini:1};

/* ============ ETAPES AFFICHEES ============ */
var PHASE = {
  profil:"Votre projet", besoin:"Votre projet", usage:"Votre projet",
  modules:"Votre projet", implantation:"Votre projet", surface:"Votre projet",
  commune:"Le terrain", terrain:"Le terrain", indivision:"Le terrain", parcelle:"Le terrain", acces:"Le terrain",
  plan:"Votre plan", delai:"Votre plan",
  enveloppe:"Budget et décision", financement:"Budget et décision",
  decision:"Budget et décision", etape:"Budget et décision",
  rdvlieu:"Le rendez-vous", rdvquand:"Le rendez-vous",
  contact:"Vos coordonnées", recap:"Vos coordonnées"
};
function phaseDe(k){
  if(k === "commune" && S.besoin === "Prendre rendez-vous") return "Le rendez-vous";
  if(k === "usage" && S.besoin === "Prendre rendez-vous") return "Le rendez-vous";
  if(k === "delai" && S.besoin === "Prendre rendez-vous") return "Le rendez-vous";
  return PHASE[k] || "";
}
function listePhases(){
  var out = [], vu = {};
  for(var i=0;i<ordre.length;i++){
    var f = phaseDe(ordre[i]);
    if(f && !vu[f]){ vu[f] = 1; out.push(f); }
  }
  return out;
}
/* Progression reelle : elle avance a chaque ecran et ne revient jamais en arriere.
   Avant que le besoin soit choisi on prend le parcours amenagement comme hypothese,
   pour que le pourcentage parte de zero des la premiere question. */
function ecransUtiles(){
  var L = ordre;
  if(!S.besoin){
    S.besoin = "Aménager un conteneur";
    L = parcours();
    delete S.besoin;
  }
  var u = [];
  for(var i=0;i<L.length;i++)
    if(L[i] !== "fini" && L[i] !== "redirection") u.push(L[i]);
  return u;
}
function progression(){
  var u = ecransUtiles(), pos = u.indexOf(ordre[idx]);
  if(pos < 0) return null;
  return Math.round((pos + 1) / u.length * 100);
}
function compteur(){
  var f = phaseDe(ordre[idx]), pc = progression();
  if(!f || pc === null) return "";
  return '<b>' + pc + ' %</b><i>·</i>' + esc(f);
}

/* ============ MODULES ============ */
/* Le nombre de conteneurs est saisi explicitement : c est lui qui donne l echelle
   du projet. Tout le reste — surface, plans, budget — en decoule et porte sur
   l ensemble, jamais sur un module isole. */
var S20 = 13, S40 = 28; /* surface au sol arrondie, hors tout */

function nMod(k){ var v = parseInt(S[k], 10); return (isNaN(v) || v < 0) ? 0 : Math.min(60, v); }
function totalMod(){ return nMod("n20") + nMod("n40"); }
function surfaceMod(){ return nMod("n20") * S20 + nMod("n40") * S40; }
function libelleMod(){
  if(S.modules === "\u00c0 d\u00e9finir") return "nombre \u00e0 d\u00e9finir";
  var a = nMod("n20"), b = nMod("n40"), p = [];
  if(a) p.push(a + " \u00d7 20 pieds");
  if(b) p.push(b + " \u00d7 40 pieds");
  return p.join(" + ");
}
/* Cout d acquisition des conteneurs, prix publics de la page de vente, hors
   supplement de commune : plancher volontairement prudent. */
function plancherConteneurs(){ return nMod("n20") * BASE20 + nMod("n40") * BASE40; }

/* Bareme de l architecte, sans marge. Le premier conteneur porte le tarif de base,
   les suivants le tarif additionnel. */
function prixPlan(){
  var a = nMod("n20"), b = nMod("n40");
  if(a + b < 1) return null;
  if(b > 0) return [53700 + (b - 1) * 29900 + a * 17900, 65700 + (b - 1) * 35800 + a * 23900];
  return [35800 + (a - 1) * 17900, 47800 + (a - 1) * 23900];
}

function blocModules(){
  if(S.modules === "\u00c0 d\u00e9finir")
    return '<div class="note">Nombre de conteneurs \u00e0 d\u00e9finir. Indiquez tout de m\u00eame une surface approximative \u00e0 l\'\u00e9cran suivant : elle me suffit pour situer le projet.</div>';
  var t = totalMod();
  if(!t) return "";
  return '<div class="prix"><div class="lb">Votre projet</div>'
       + '<div class="val" style="font-size:21px;line-height:1.3">' + esc(libelleMod()) + '</div>'
       + '<div class="det"><b>' + surfaceMod() + ' m\u00b2 au sol au total</b>'
       + (t > 1 ? ' \u00b7 ' + t + ' modules, soit ' + (nMod("n40") && nMod("n20") ? S20 + ' et ' + S40 : (nMod("n40") ? S40 : S20)) + ' m\u00b2 par module' : '')
       + '. La surface, les plans et le budget demand\u00e9s ensuite portent sur cet ensemble.</div></div>';
}
function majMod(k, v){
  S[k] = v;
  if(S.modules === "\u00c0 d\u00e9finir") delete S.modules;
  var t = totalMod();
  if(t) S.modules = libelleMod(); else delete S.modules;
  /* la surface suit le nombre de modules tant que le client ne l a pas corrigee lui meme */
  if(!S.surfaceManuelle){ var q = surfaceMod(); if(q) S.surface = String(q); else delete S.surface; }
  ordre = parcours();
  var z = document.getElementById("modres"); if(z) z.innerHTML = blocModules();
  var b = document.getElementById("modx"); if(b) b.className = "opt";
}
function modInconnu(){
  S.modules = "\u00c0 d\u00e9finir";
  delete S.n20; delete S.n40;
  if(!S.surfaceManuelle) delete S.surface;
  ordre = parcours();
  rendre();
}

/* ============ PARCOURS ============ */
function parcours(){
  var p = ["profil","besoin"];
  if(S.besoin === "Acheter un conteneur brut"){
    return ["profil","besoin","redirection"];
  } else if(S.besoin === "Aménager un conteneur"){
    p = p.concat(["usage","modules"]);
    if(totalMod() >= 2 || S.modules === "À définir") p.push("implantation");
    p = p.concat(["surface","commune","terrain"]);
    if(S.terrain === "Il m'appartient ou je le loue" || S.terrain === "Achat ou bail en cours de signature") p.push("indivision");
    p = p.concat(["parcelle","acces","plan","delai","enveloppe","financement","decision","etape","contact","recap"]);
  } else if(S.besoin === "Prendre rendez-vous"){
    p.push("rdvlieu");
    /* un deplacement sans commune est ingerable : on la demande */
    if(S.rdvlieu === "Sur mon terrain ou à mon bureau") p.push("commune");
    p = p.concat(["rdvquand","usage","delai","contact","recap"]);
  }
  p.push("fini");
  return p;
}

/* ============ COHERENCE BUDGET ============ */
/* Plancher etabli sur les devis reels 2020-2022 : sert uniquement a reperer une
   enveloppe manifestement incompatible. Jamais affiche au client, jamais un prix. */
function tauxPlancher(){
  if(S.usage === "Atelier ou stockage aménagé") return 120000;
  if(S.usage === "Sanitaire ou local spécialisé") return 160000;
  return 180000;
}
/* Marche public : reglement a 60-90 jours apres service fait, avance de
   tresorerie sur toute la duree du chantier, garanties et penalites. A
   prestation identique l enveloppe a prevoir n est pas celle d un particulier.
   Coefficient applique au seul plancher de coherence, jamais affiche comme un
   prix. C est le curseur a bouger si le reglage parait trop dur ou trop mou. */
var COEF_PUBLIC = 2;
function estPublic(){ return S.profil === "Une administration ou une commune"; }

function estimPlancher(){
  var m = parseFloat(String(S.surface||"").replace(",","."));
  if(!m || m <= 0) return null;
  /* l enveloppe annoncee par le client couvre l ensemble : les conteneurs
     eux-memes plus leur amenagement. Prix conteneurs = tarifs publics de la
     page de vente, hors supplement de commune. */
  return Math.round((m * tauxPlancher() + plancherConteneurs()) * (estPublic() ? COEF_PUBLIC : 1));
}
function plafondEnveloppe(){
  if(S.enveloppe === "2 à 3 millions XPF") return 3000000;
  if(S.enveloppe === "3 à 5 millions XPF") return 5000000;
  if(S.enveloppe === "5 à 10 millions XPF") return 10000000;
  if(S.enveloppe === "10 à 20 millions XPF") return 20000000;
  if(S.enveloppe === "20 à 30 millions XPF") return 30000000;
  if(S.enveloppe === "30 à 50 millions XPF") return 50000000;
  if(S.enveloppe === "50 millions XPF et plus") return 1e12;
  return null;
}
function coherenceBudget(){
  var e = estimPlancher(), pl = plafondEnveloppe();
  if(e === null || pl === null) return "inconnue";
  if(pl < e * 0.8) return "incompatible";
  if(pl < e) return "juste";
  return "coherente";
}

/* ============ NOTATION ============ */
function noter(){
  var A=0,B=0,C=0,D=0,Ee=0,F=0, dr=[];
  var rdv = (S.besoin === "Prendre rendez-vous");

  /* A - precision du projet (20) */
  if(rdv){
    A = 8;
    if(S.usage && S.usage !== "Autre projet") A += 4;
    if(S.rdvlieu) A += 2;
  } else {
    if(S.usage && S.usage !== "Autre projet") A += 5;
    if(S.surface) A += 4;
    if(S.plan === "Oui, un plan coté") A += 7;
    else if(S.plan === "Un croquis à main levée") A += 4;
    if(typeof PJ !== "undefined" && PJ.length) A += 4;
  }
  A = Math.min(20, A);

  /* B - terrain et logistique (15) */
  if(rdv) B = 9;
  else {
    if(S.terrain === "Il m'appartient ou je le loue") B = 12;
    else if(S.terrain === "Achat ou bail en cours de signature") B = 9;
    else if(S.terrain === "Je l'ai repéré, il n'est pas encore à moi") B = 4;
    else B = 0;
    if(S.acces === "Oui, l'accès est dégagé") B += 3;
    else if(S.acces === "Non, l'accès est difficile") B -= 3;
    if(S.parcelle && String(S.parcelle).length > 2) B += 2;
  }
  B = Math.max(0, Math.min(15, B));

  /* C - budget et financement (25) */
  var coh = coherenceBudget();
  if(rdv) C = 12;
  else {
    if(coh === "coherente") C = 15;
    else if(coh === "juste"){ C = 9; dr.push("enveloppe juste"); }
    else if(coh === "incompatible"){ C = 3; dr.push("enveloppe incompatible avec la surface"); }
    else C = 6;
    var f = String(S.financement || "");
    if(f.indexOf("Fonds propres") > -1 || f.indexOf("déjà accordé") > -1
       || f.indexOf("subvention notifiée") > -1) C += 10;
    else if(f.indexOf("cours d'instruction") > -1) C += 6;
    else if(f.indexOf("reste à monter") > -1) C += 2;
  }
  C = Math.max(0, Math.min(25, C));

  /* D - echeance (15) */
  if(S.delai === "Dans le mois") D = 15;
  else if(S.delai === "Dans 1 à 3 mois") D = 13;
  else if(S.delai === "Dans 3 à 6 mois") D = 9;
  else if(S.delai === "Dans plus de 6 mois") D = 4;
  else D = 0;

  /* E - pouvoir de decision (10) */
  if(rdv) Ee = 7;
  else if(S.decision === "Je décide seul") Ee = 10;
  else if(S.decision && S.decision.indexOf("en couple") > -1) Ee = 8;
  else if(S.decision && S.decision.indexOf("associé") > -1) Ee = 5;
  else if(S.decision && S.decision.indexOf("pas encore parlé") > -1) Ee = 4;
  else if(S.decision && S.decision.indexOf("quelqu'un d'autre") > -1) Ee = 0;
  else Ee = 4;

  /* F - engagement (15) */
  var et = String(S.etape||"").toLowerCase();
  if(rdv) F = 15;
  else if(et.indexOf("je commande") > -1) F = 15;
  else if(et.indexOf("compare") > -1) F = 11;
  else if(et.indexOf("j'en parle") > -1) F = 9;
  else if(et.indexOf("plus tard") > -1) F = 4;
  else F = 4;
  if(!rdv && S.plan === "Oui, un plan coté") F += 2;
  F = Math.max(0, Math.min(15, F));

  if(S.indivision === "Oui, et elle n'est pas réglée") dr.push("indivision non réglée");
  if(S.acces === "Non, l'accès est difficile") dr.push("accès camion-grue difficile");
  if(S.terrain === "Je n'ai pas encore de terrain") dr.push("pas de terrain");

  var sc = Math.max(0, Math.min(100, A+B+C+D+Ee+F));
  /* Les verrous abaissent le score lui-meme, pas seulement le niveau :
     le score affiche et le niveau ne peuvent plus se contredire. */
  /* Une administration qui sous-estime l enveloppe reste un dossier a traiter :
     le budget se renegocie, la commande publique pas. On plafonne moins fort. */
  if(coh === "incompatible") sc = Math.min(sc, estPublic() ? 69 : 44);
  if(S.terrain === "Je n'ai pas encore de terrain"
     || S.terrain === "Je l'ai repéré, il n'est pas encore à moi") sc = Math.min(sc, 69);
  if(S.indivision === "Oui, et elle n'est pas réglée") sc = Math.min(sc, 84);

  var n = sc >= 85 ? 5 : sc >= 70 ? 4 : sc >= 45 ? 3 : sc >= 25 ? 2 : 1;
  var noms = ["","Froid","À qualifier","Sérieux","Chaud","Prioritaire"];
  return {score:sc, niveau:n, nom:noms[n], detail:"A"+A+" B"+B+" C"+C+" D"+D+" E"+Ee+" F"+F,
          drapeaux:dr.join(", ")};
}

/* ============ GABARIT A L ECHELLE ============ */
/* Dessin de cote, 25 pixels par metre. Le personnage mesure 1,80 m
   et se tient a l interieur : le client voit la hauteur sous plafond. */
function bonhomme(x, sol, t){
  t = t || 45; /* 45 px = 1,80 m a l echelle de 25 px par metre */
  var e = t / 45;
  return '<g fill="#e07b15" transform="translate(' + x + ',' + (sol - t) + ') scale(' + e + ')">'
       + '<circle cx="7" cy="4.5" r="4.5"/>'
       + '<path d="M7 10.5 c-5.5 0 -6.5 3.5 -6.5 7.5 v9.5 h2.6 v17.5 h2.6 v-16 h2.6 v16 h2.6 v-17.5 h2.6 v-9.5 c0 -4 -1 -7.5 -6.5 -7.5 z"/>'
       + '</g>';
}
function cote(x1, y1, x2, y2, txt, tx, ty, anc){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#98a2b3" stroke-width="1"/>'
       + '<text x="' + tx + '" y="' + ty + '" font-size="9" fill="#5b6470" text-anchor="' + anc + '">' + txt + '</text>';
}
function boite(x, y, w, h, titre, ty){
  var g = '<text x="' + x + '" y="' + ty + '" font-size="10.5" font-weight="700" fill="#1e3a5f">' + titre + '</text>';
  g += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2" fill="#eef2f8" stroke="#1e3a5f" stroke-width="1.6"/>';
  var nb = Math.round(w / 15); /* une nervure tous les 60 cm environ */
  for(var i = 1; i < nb; i++){
    var cx = x + w * i / nb;
    g += '<line x1="' + cx + '" y1="' + (y + 4) + '" x2="' + cx + '" y2="' + (y + h - 4) + '" stroke="#c9d4e4" stroke-width="1"/>';
  }
  g += '<line x1="' + (x - 6) + '" y1="' + (y + h) + '" x2="' + (x + w + 6) + '" y2="' + (y + h) + '" stroke="#1e3a5f" stroke-width="1.4"/>';
  return g;
}
/* Vue de dessus : un simple rectangle a l echelle, longueur par largeur,
   avec la surface au sol et le volume. Meme echelle que la vue de cote. */
function dessus(x, y, L, W, k, titre, ty, surf){
  var w = L * k, h = W * k;
  var g = '<text x="' + x + '" y="' + ty + '" font-size="10.5" font-weight="700" fill="#1e3a5f">' + titre + '</text>';
  g += '<rect x="' + x + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="#eef2f8" stroke="#1e3a5f" stroke-width="1.6"/>';
  /* portes sur le bout droit */
  g += '<line x1="' + (x + w - 7).toFixed(1) + '" y1="' + y + '" x2="' + (x + w - 7).toFixed(1) + '" y2="' + (y + h).toFixed(1) + '" stroke="#1e3a5f" stroke-width="1"/>';
  /* une personne vue de dessus : 55 cm de large */
  var r = 0.275 * k;
  g += '<circle cx="' + (x + 22).toFixed(1) + '" cy="' + (y + h / 2).toFixed(1) + '" r="' + r.toFixed(1) + '" fill="#e07b15"/>';
  g += '<text x="' + (x + w / 2 + 14).toFixed(1) + '" y="' + (y + h / 2 + 5).toFixed(1) + '" font-size="13" font-weight="800" fill="#a04c05" text-anchor="middle">' + surf + '</text>';
  g += cote(x, y + h + 12, x + w, y + h + 12, L.toFixed(2).replace(".", ",") + " m", x + w / 2, y + h + 25, "middle");
  g += cote(x + w + 8, y, x + w + 8, y + h, "2,44 m", x + w + 12, y + h / 2 + 3, "start");
  return g;
}
var PLONGEE = (function(){
  var k = 25;
  var v = '<svg viewBox="0 0 360 234" role="img" aria-label="Vue de dessus a l echelle d un conteneur 20 pieds et d un 40 pieds">';
  v += dessus(14, 22, 6.06, 2.44, k, "20 pieds DRY — vu de dessus", 15, "13 m²");
  v += dessus(14, 135, 12.19, 2.44, k, "40 pieds HC — vu de dessus", 128, "28 m²");
  return v + '</svg>';
})();

var GABARIT = (function(){
  var v = '<svg viewBox="0 0 360 248" role="img" aria-label="Comparaison a l echelle d un conteneur 20 pieds et d un 40 pieds avec une personne de 1,80 m">';
  /* 20 pieds : 6,06 x 2,59 m */
  v += boite(14, 22, 151.5, 64.75, "20 pieds DRY", 15);
  v += bonhomme(30, 86.75);
  v += cote(172, 22, 172, 86.75, "2,59 m", 176, 57, "start");
  v += cote(14, 100, 165.5, 100, "6,06 m", 90, 113, "middle");
  /* 40 pieds : 12,19 x 2,90 m */
  v += boite(14, 140, 304.75, 72.5, "40 pieds HC", 133);
  v += bonhomme(30, 212.5);
  v += cote(325, 140, 325, 212.5, "2,90 m", 329, 179, "start");
  v += cote(14, 226, 318.75, 226, "12,19 m", 166, 239, "middle");
  return v + '</svg>';
})();

/* ============ RENDU ============ */
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function blocPrix(){
  if(S.besoin !== "Acheter un conteneur brut" || !S.commune) return "";
  var c = comInfo(S.commune);
  if(c && c[1] === -1)
    return '<div class="prix"><div class="lb">Transport maritime</div><div class="val">Sur devis</div>'
         + '<div class="det">Je consulte la compagnie et je vous donne le montant exact sous 48 h.</div></div>';
  var u = prixUnitaire();
  if(u === null)
    return '<div class="prix"><div class="lb">Prix livré à ' + esc(S.commune) + '</div>'
         + '<div class="val">' + fmt(BASE20 + c[1]) + ' à ' + fmt(BASE40 + c[2]) + ' XPF</div>'
         + '<div class="det">Selon le format, du 20 DRY au 40 HC. Livraison et pose comprises.</div></div>';
  var t = prixTotal(), q = parseInt(S.quantite,10) || 1;
  var quai = S.commune.indexOf("au quai") > -1;
  return '<div class="prix"><div class="lb">' + esc(S.format) + ' livré à ' + esc(S.commune) + '</div>'
       + '<div class="val">' + fmt(t) + ' XPF</div>'
       + '<div class="det">' + (q > 1 ? fmt(u) + ' XPF l\'unité × ' + q + ' · ' : '')
       + (quai ? 'mise à disposition au quai, livraison sur terrain sur devis'
               : 'transport et pose compris') + ' · TTC</div></div>';
}

  var pcb = (e.fini || e.redirect) ? 100 : progression();
  document.getElementById("bar").style.width = (pcb === null ? 0 : pcb) + "%";

  if(e.fini){
    var r = noter();
    h = '<div class="step on"><div class="fin"><div class="ok">✓</div>'
      + '<h2>C\'est envoyé, merci.</h2>'
      + '<p class="sub">Votre demande est bien arrivée.'
      + (r.niveau >= 4 ? ' Votre projet est prêt : je vous appelle dans les 24 heures.' : ' Je vous réponds sous 48 heures.')
      + (S.mail ? '<br>Ma réponse partira sur ' + esc(S.mail) + '.' : '') + '</p></div>';
    h += '<div class="note">Si votre projet est urgent, appelez-moi directement au <b>87 22 65 55</b>.</div>';

      h += '<div class="note">Pour aller jusqu\'au chiffrage poste par poste et au planning de travaux, l\'étude de votre projet est facturée <b>' + tarifEtude() + '</b>, déduite de votre commande. Je ne vous la propose qu\'après notre premier échange.</div>';
    h += '</div>';

    document.getElementById("back").style.display = "none";
    document.getElementById("next").style.display = "none";
    window.scrollTo(0,0);
    return;
  }

  if(e.redirect){
    h = '<div class="step on"><div class="kicker">' + esc(e.k) + '</div><h2>' + esc(e.q) + '</h2>'
      + '<p class="sub">' + e.sub + '</p>'
      + '<a class="btn p" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" href="'
      + SITE_ACHAT + '">Voir les prix et commander</a>'
      + '<div class="note">Vous y choisissez le format et votre commune, le prix exact s\'affiche, et vous envoyez votre demande depuis la même page.</div></div>';

  h += '<h2>' + esc(e.q) + '</h2>';
  if(e.sub) h += '<p class="sub">' + e.sub + '</p>';
  if(e.reperes){

         + '<div class="val" style="font-size:22px;line-height:1.35">Plan 2D : ' + fmt(pp[0]) + ' XPF</div>'

    h += '<div class="note">' + e.reperes + '</div>';

      h += '<button class="opt' + (actif ? ' sel' : '') + '" onclick="' + (e.multi ? 'coche' : 'choix') + '(\'' + e.ch + '\',' + i + ')">'
         + '<span class="ic">✓</span><span class="tx">' + esc(v)
         + (d ? '<small>' + esc(d) + '</small>' : '') + '</span></button>';
    }
    h += '</div>';
  }
  if(e.sel){
    h += '<label class="f"><span>Île et commune</span><select id="i_' + e.sel + '" onchange="maj(\'' + e.sel + '\',this.value)">'
       + '<option value="">— choisissez —</option>';
    for(var j=0;j<COM.length;j++)
      h += '<option' + (S[e.sel] === COM[j][0] ? ' selected' : '') + '>' + esc(COM[j][0]) + '</option>';

  }
  if(e.mod){

       + '<label class="f"><span>Conteneurs 20 pieds</span><input id="i_n20" type="number" inputmode="numeric" min="0" max="60" step="1" placeholder="0" value="' + esc(S.n20||"") + '" oninput="majMod(\'n20\',this.value)"></label>'

/* ============ PIECES JOINTES ============ */
var PJ = [], PJMAX = 6, PJUN = 4 * 1024 * 1024, PJTOT = 9 * 1024 * 1024;

function poids(o){ return o < 1048576 ? Math.max(1, Math.round(o/1024)) + " Ko" : (o/1048576).toFixed(1).replace(".",",") + " Mo"; }
function totalPJ(){ var t=0; for(var i=0;i<PJ.length;i++) t += PJ[i].blob.size; return t; }

function listePJ(){
  var h = "";
  for(var i=0;i<PJ.length;i++)
    h += '<div class="pjf"><span class="nm">' + esc(PJ[i].nom) + '</span>'
       + '<span class="sz">' + poids(PJ[i].blob.size) + '</span>'
       + '<button class="rm" type="button" title="Retirer" onclick="retirePJ(' + i + ')">×</button></div>';
  if(PJ.length) h += '<p class="pja">' + PJ.length + (PJ.length>1?" fichiers joints, ":" fichier joint, ")
       + poids(totalPJ()) + ' au total.</p>';
  if(window.PJMSG) h += '<div class="pjerr">' + esc(PJMSG) + '</div>';
  return h;
}
function rafraichirPJ(){ var z=document.getElementById("pjliste"); if(z) z.innerHTML = listePJ(); }
function retirePJ(i){ PJ.splice(i,1); PJMSG=""; rafraichirPJ(); }

function compresse(f){
  return new Promise(function(res){
    if(String(f.type).indexOf("image/") !== 0 || f.type === "image/gif"){ res({nom:f.name, blob:f}); return; }
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function(){
      try{
        var M = 1600, r = Math.min(1, M / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(b){
          URL.revokeObjectURL(url);
          if(b && b.size < f.size) res({nom:String(f.name).replace(/\.[^.]+$/,"") + ".jpg", blob:b});
          else res({nom:f.name, blob:f});
        }, "image/jpeg", 0.72);
      }catch(err){ URL.revokeObjectURL(url); res({nom:f.name, blob:f}); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res({nom:f.name, blob:f}); };
    img.src = url;
  });
}

function ajoutPJ(input){
  var fs = Array.prototype.slice.call(input.files || []);
  input.value = "";
  if(!fs.length) return;
  PJMSG = "";
  var z = document.getElementById("pjliste");
  if(z) z.innerHTML = '<p class="pja">Préparation des fichiers…</p>';
  Promise.all(fs.map(compresse)).then(function(prets){
    for(var i=0;i<prets.length;i++){
      var f = prets[i];
      if(PJ.length >= PJMAX){ PJMSG = "6 fichiers au maximum. Les suivants n'ont pas été ajoutés."; break; }
      if(f.blob.size > PJUN){ PJMSG = f.nom + " dépasse 4 Mo et n'a pas pu être joint. Envoyez-le-moi par mail après votre demande."; continue; }
      if(totalPJ() + f.blob.size > PJTOT){ PJMSG = "Limite de 9 Mo atteinte. " + f.nom + " n'a pas été ajouté."; continue; }
      PJ.push(f);
    }
    rafraichirPJ();
  }).catch(function(){ PJMSG = "Un fichier n'a pas pu être lu."; rafraichirPJ(); });
}

function envoiPJ(sujet){
  if(!PJ.length) return;
  try{
    var fd = new FormData();
    fd.append("_subject", "Pièces jointes — " + sujet);
    fd.append("_template", "box");
    fd.append("_captcha", "false");
    fd.append("Rappel", "Ces fichiers accompagnent la demande de " + (S.nom||"sans nom")
      + (S.tel ? " — " + S.tel : "") + (S.mail ? " — " + S.mail : "") + ".");
    fd.append("Nombre", PJ.length + (PJ.length>1 ? " fichiers" : " fichier"));
    /* un nom de champ distinct par fichier : le relais n en garde qu un seul si les noms sont identiques */
    for(var i=0;i<PJ.length;i++) fd.append(i ? "attachment" + (i+1) : "attachment", PJ[i].blob, PJ[i].nom);
    fetch(RELAIS_PJ, {method:"POST", mode:"no-cors", body:fd});
  }catch(e){}
}

function choix(champ, i){
  var e = E[ordre[idx]];
  S[champ] = e.o[i][0];
  ordre = parcours();

  /* sur un ecran qui accepte des pieces jointes on n avance pas tout seul :
     le client doit avoir le temps de joindre son plan avant de passer a la suite */
  if(!e.pj) setTimeout(suiv, 180);
}
/* choix multiple : on empile les reponses, l option marquee exclusive chasse les autres */
var MULTI = {};
function coche(champ, i){
  var e = E[ordre[idx]], v = e.o[i][0], excl = !!e.o[i][2];
  var a = MULTI[champ] || (MULTI[champ] = []);
  var k = a.indexOf(v);
  if(k > -1) a.splice(k, 1);
  else if(excl){ a.length = 0; a.push(v); }
  else {
    for(var j = a.length - 1; j >= 0; j--){
      for(var q = 0; q < e.o.length; q++)
        if(e.o[q][0] === a[j] && e.o[q][2]) a.splice(j, 1);
    }
    a.push(v);
  }
  var rang = {};
  for(var z = 0; z < e.o.length; z++) rang[e.o[z][0]] = z;
  a.sort(function(x, y){ return rang[x] - rang[y]; });
  S[champ] = a.join(" · ");
  ordre = parcours();
  rendre();
}

}

function topo(r){
  var N=NIV[r.niveau], L=[];
  function bloc(t,ls){ ls=ls.filter(function(x){return x;}); if(!ls.length) return;
    L.push(""); L.push(t); L.push(tir(t.length)); for(var i=0;i<ls.length;i++) L.push(ls[i]); }

  L.push(N.n+"          "+r.score+"/100");
  L.push(""); L.push("CE QU'IL FAUT FAIRE"); L.push(tir(19));
  for(var i=0;i<N.a.length;i++) L.push("  "+(i+1)+". "+N.a[i]);
  if(coherenceBudget()==="incompatible"){
    L.push("");
    L.push("  ! Seul le budget bloque : le reste du dossier peut être solide.");
    L.push("    Appelez pour recadrer, annoncez la fourchette réelle, laissez-le décider.");
    L.push("    Ne produisez aucun devis avant d'avoir eu cette conversation.");
  }

  bloc("LE CLIENT",[lg("",(S.nom||"sans nom")+(S.structure?"  —  "+S.structure:"")),
    lg("",S.profil),lg("Téléphone",S.tel),lg("Email",S.mail)]);

  var pr=[lg("Besoin",S.besoin),lg("Usage",S.usage),
    lg("Conteneurs",S.modules?libelleMod():""),lg("Implantation",S.implantation),
    lg("Surface totale",S.surface?S.surface+" m² au sol":""),
    lg("Format",S.format?S.format+(S.quantite?"  ×"+S.quantite:""):""),lg("Lieu",S.commune)];
  var t=prixTotal(); if(t&&t!=="devis") pr.push(lg("Prix livré",fmt(t)+" XPF TTC"));
  pr=pr.concat([lg("Terrain",S.terrain),lg("Indivision",S.indivision),lg("Parcelle",S.parcelle),
    lg("Accès grue",S.acces),lg("Plan",S.plan),
    lg("Fichiers joints",PJ.length?(PJ.length+(PJ.length>1?" fichiers envoyés dans un second mail":" fichier envoyé dans un second mail")):""),
    lg("Échéance",S.delai),
    lg("Lieu du RDV",S.rdvlieu),lg("Moment",S.rdvquand)]);
  bloc("LE PROJET",pr);

  var ar=[lg("Enveloppe",S.enveloppe),lg("Financement",S.financement)];
  var pl=estimPlancher(), coh=coherenceBudget();
  if(pl){
    var pc = plancherConteneurs();
    ar.push(lg("Plancher estimé",fmt(pl)+" XPF pour l'ensemble du projet"));
    if(estPublic()) ar.push(lg("",  "coefficient marché public x"+COEF_PUBLIC+" appliqué (délai de règlement et portage de trésorerie)"));
    if(pc) ar.push(lg("",  "base : "+fmt(pc)+" XPF de conteneurs ("+libelleMod()+") + "+fmt(Math.round(pl/(estPublic()?COEF_PUBLIC:1))-pc)+" XPF d'aménagement"));
    else   ar.push(lg("",  "base : surface x taux plancher constaté sur vos devis"));
  }
  var pp2 = (typeof prixPlan==="function") ? prixPlan() : null;
  if(pp2) ar.push(lg("Plans architecte","2D "+fmt(pp2[0])+" XPF  ·  3D "+fmt(pp2[1])+" XPF  (sans marge)"));
  if(coh==="incompatible") ar.push(lg("ALERTE","enveloppe sous le plancher : à recadrer dès le premier appel"));
  else if(coh==="juste") ar.push(lg("Attention","enveloppe juste au regard du plancher constaté"));
  var et=tarifEtude(); if(et) ar.push(lg("Étude applicable",et+"  (déduite de la commande)"));
  bloc("L'ARGENT",ar);
  bloc("LA DÉCISION",[lg("Décide",S.decision),lg("Prochaine étape",S.etape)]);
  if(S.msg) bloc(String(S.msg).indexOf("?")>-1 ? "SES QUESTIONS" : "SON MESSAGE",["  "+String(S.msg).replace(/\n/g,"\n  ")]);

  var v=vigilance(); if(r.drapeaux) v.unshift("  ⚑ "+r.drapeaux);
  bloc("POINTS DE VIGILANCE",v.length?v:["  Aucun."]);
  bloc("RÉPONSE PRÊTE À COPIER",["",REP[r.niveau].replace("[P]",String(S.nom||"").trim().split(" ")[0]||"")]);

  L.push(""); L.push(tir(64));
  L.push("Notation : "+r.detail);
  L.push("Reçu le "+new Date().toLocaleString("fr-FR")+"  —  page de demande TMC");
  return L.join("\n");
}

function accuse(r){
  var p = String(S.nom||"").trim().split(" ")[0] || "";
  var L = ["Bonjour " + p + ",", "", "J'ai bien reçu votre demande, merci d'avoir pris le temps de la détailler."];
  var terrainOK = (S.terrain === "Il m'appartient ou je le loue" || S.terrain === "Achat ou bail en cours de signature"
                   || S.besoin !== "Aménager un conteneur");
  var budgetOK = (S.enveloppe && S.enveloppe !== "Je ne sais pas encore, j'ai besoin d'être conseillé")
                 || (S.budget && S.budget.indexOf("Oui") === 0)
                 || (S.budget && S.budget.indexOf("ajuster") > -1);
  if(r.niveau >= 4 && terrainOK && budgetOK)
    L.push("Votre projet est complet : je vous appelle dans les 24 heures, et vous recevrez une proposition chiffrée dans la foulée.");
  else if(r.niveau >= 3 && terrainOK && budgetOK)
    L.push("Je vous prépare une estimation chiffrée que vous recevrez sous 48 heures, puis je vous appelle pour caler les derniers points.");
  else
    L.push("Je reviens vers vous sous 48 heures. Pour vous répondre avec un chiffre juste plutôt qu'une moyenne, il me manquera sans doute quelques précisions : je vous dirai lesquelles.");
  L.push(""); L.push("Voici ce que vous m'avez transmis :");
  var a = lignesRecap();
  for(var i=0;i<a.length;i++) L.push("   " + a[i][0] + " : " + a[i][1]);
  var et = tarifEtude();
  if(et){ L.push("");
    L.push("Pour votre information : pour aller jusqu'au chiffrage poste par poste et au planning de travaux, l'étude de votre projet est facturée " + et + ", intégralement déduite de votre commande si vous donnez suite. Je ne vous la proposerai qu'après notre premier échange, jamais avant.");
  }
  L.push(""); L.push("Si votre projet est urgent, appelez-moi directement au 87 22 65 55.");
  L.push(""); L.push("Bien cordialement,");
  L.push("Jean-Baptiste HAUATA");
  L.push("Tahiti Maison Container — N° Tahiti 710194");
  L.push("87 22 65 55 — tahitimaisoncontainer@gmail.com");
  L.push("Domaine Vaitarua, Afaahiti, Taiarapu-Est");
  return L.join("\n");
}

function objet(r){
  var N=NIV[r.niveau], res=(S.usage||S.format||S.besoin||"");
  if(S.modules && S.modules!=="À définir") res+=" "+libelleMod().replace(/×/g,"x");
  if(S.surface) res+=" "+S.surface+" m2";
  if(S.commune) res+=" a "+S.commune;
  return (N.e?N.e+" ":"")+N.t+" ("+r.score+"/100) — "+(S.nom||"sans nom")+" — "+res;
}

/* ============ ENVOI ============ */
function envoyer(){
  var b = document.getElementById("next");
  b.disabled = true; b.textContent = "Envoi…";
  var r = noter();
  var t = prixTotal();
  var charge = {
    _subject : objet(r),
    _template: "box",
    _captcha : "false",
    _replyto : S.mail || "",
    "Message pret a envoyer au client" : accuse(r),
    "Topo"   : topo(r),
    "Nom"    : S.nom || "",
    "Telephone": S.tel || "",
    "Email"  : S.mail || "",
    "Niveau" : r.niveau + " — " + r.nom,
    "Score"  : r.score + "/100",
    "Besoin" : S.besoin || "",
    "Lieu"   : S.commune || "",
    "Prix"   : (t && t !== "devis") ? fmt(t) + " XPF" : ""
  };
  function fin(){ idx = ordre.length - 1; b.disabled = false; rendre(); }
  envoiPJ(objet(r));
  try{
    fetch(RELAIS, {method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(charge)}).then(fin).catch(fin);
    setTimeout(function(){ if(b.disabled) fin(); }, 6000);
  }catch(e){ fin(); }
}

/* ============ DEMARRAGE ============ */
ordre = parcours();
rendre();
</script>
